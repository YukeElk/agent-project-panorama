function fitView(){if(!S.bounds)return;const svg=$("canvas"),cw=svg.clientWidth||800,ch=svg.clientHeight||600,pad=42,b=S.bounds;S.scale=Math.max(.35,Math.min(1.25,Math.min((cw-pad*2)/b.w,(ch-pad*2)/b.h)));S.tx=(cw-b.w*S.scale)/2-b.x*S.scale;S.ty=(ch-b.h*S.scale)/2-b.y*S.scale;render()}
function syncHash(kind,id){const p=new URLSearchParams();p.set("view",S.view.viewId);if(kind&&id)p.set(kind,id);if(S.trace!=="neighbors")p.set("trace",S.trace);history.replaceState(null,"","#"+p.toString())}

function showEdge(id){const edge=S.view.edges.find(x=>x.id===id),r=edge&&relations.get(edge.relationRef.id);if(!r)return;S.selectedRelation=r.id;syncHash("relation",r.id);$("details").innerHTML=`<h2>${esc(r.name)}</h2><div class="mono">${esc(r.id)}</div><span class="chip">${esc(r.kind)}</span><span class="chip">order=${esc(r.semantics.order)}</span><h3>Binding</h3><p class="mono">${esc(r.fromEntityId)} → ${esc(r.toEntityId)}</p><h3>Semantics</h3><pre class="mono">${esc(JSON.stringify(r.semantics,null,2))}</pre><h3>Evidence</h3>${evidence(r)}`;$("drawer").classList.remove("closed")}
function explainOptions(){return explainPack.stories.map((story,index)=>`<option value="${index}">${esc(story.title)}</option>`).join("")}
function syncExplain(){if(!explainPack||S.explainStory<0)return;const story=explainPack.stories[S.explainStory],chapter=chapters.find(item=>item.chapterId===story.viewBinding.chapterId);if(chapter&&chapter.chapterId!==S.chapter.chapterId){S.chapter=chapter;S.view=viewById.get(chapter.viewId);S.selected=null;S.selectedRelation=null}const step=story.steps[S.explainStep];S.explainNodeIds=new Set(step.focusNodeIds);S.explainEdgeIds=new Set(step.focusEdgeIds);$("explain-story").value=String(S.explainStory);$("explain-binding").textContent=`${story.kind} · ${story.storyId}`;$("explain-step-title").textContent=step.title;$("explain-step-summary").textContent=step.summary;$("explain-claims").innerHTML=step.claimBlocks.map(claim=>`<li>${esc(claim.text)}</li>`).join("");const boundary=[...step.caveats,...step.informationGaps.map(gap=>`Information Gap: ${gap}`)];$("explain-caveat").hidden=!boundary.length;$("explain-caveat").textContent=boundary.length?`边界：${boundary.join("；")}`:"";$("explain-progress").textContent=`${S.explainStep+1} / ${story.steps.length}`;$("explain-prev").disabled=S.explainStep===0;$("explain-next").disabled=S.explainStep===story.steps.length-1;render();requestAnimationFrame(fitView)}
function openExplain(){if(!explainPack)return;const preferred=explainPack.stories.findIndex(story=>story.kind==="view"&&story.viewBinding.chapterId===S.chapter.chapterId);S.explainStory=preferred>=0?preferred:0;S.explainStep=0;$("explain-story").innerHTML=explainOptions();$("explain-dialog").showModal();syncExplain()}

if(explainPack){$("explain").hidden=false;$("explain").onclick=openExplain;$("close-explain").onclick=closeExplain;$("explain-story").onchange=e=>{S.explainStory=Number(e.target.value);S.explainStep=0;syncExplain()};$("explain-prev").onclick=()=>{if(S.explainStep>0){S.explainStep-=1;syncExplain()}};$("explain-next").onclick=()=>{const story=explainPack.stories[S.explainStory];if(S.explainStep<story.steps.length-1){S.explainStep+=1;syncExplain()}};$("explain-dialog").addEventListener("cancel",e=>{e.preventDefault();closeExplain()})}
const svg=$("canvas");svg.onwheel=e=>{e.preventDefault();const old=S.scale;S.scale=Math.max(.35,Math.min(2.4,S.scale*(e.deltaY<0?1.1:.9)));const rect=svg.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;S.tx=x-(x-S.tx)*(S.scale/old);S.ty=y-(y-S.ty)*(S.scale/old);render()};svg.onpointerdown=e=>{S.drag={x:e.clientX,y:e.clientY,tx:S.tx,ty:S.ty};svg.setPointerCapture(e.pointerId);svg.classList.add("dragging")};svg.onpointermove=e=>{if(!S.drag)return;S.tx=S.drag.tx+e.clientX-S.drag.x;S.ty=S.drag.ty+e.clientY-S.drag.y;render()};svg.onpointerup=()=>{S.drag=null;svg.classList.remove("dragging")};

function fromHash(){const p=new URLSearchParams(location.hash.slice(1)),v=viewById.get(p.get("view"));if(v){S.view=v;S.chapter=chapters.find(c=>c.viewId===v.viewId)}const trace=p.get("trace");if(["neighbors","upstream","downstream","connected"].includes(trace))S.trace=trace;$("trace-mode").value=S.trace;const entity=p.get("entity"),relation=p.get("relation"),n=entity&&S.view.nodes.find(x=>x.entityRef.id===entity),edge=relation&&S.view.edges.find(x=>x.relationRef.id===relation);S.selectedEntity=entity||S.selectedEntity;S.selectedRelation=relation||null;S.selected=n?n.id:null;render();if(n)showNode(n.id);else if(edge)showEdge(edge.id);requestAnimationFrame(fitView)}window.addEventListener("hashchange",fromHash);fromHash()})();
