<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Agent 项目全景</title>
  <style>
    :root {
      --page: #fff;
      --band: #f7f8fb;
      --band-strong: #f1f3f8;
      --ink: #111c3a;
      --muted: #5f687d;
      --faint: #80889a;
      --rule: #d9deea;
      --rule-strong: #b8c0d4;
      --primary: #2448d8;
      --primary-hover: #1739bd;
      --primary-tint: #eef2ff;
      --passed: #168653;
      --warning: #c7790a;
      --critical: #d62f3d;
      --info: #4169b2;
      --radius: 8px;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      --topbar-height: 58px;
    }

    * { box-sizing: border-box; }
    html { background: var(--page); color: var(--ink); font-family: var(--sans); }
    body { margin: 0; min-width: 320px; background: var(--page); font-size: 14px; line-height: 1.45; }
    button, input, select { color: inherit; font: 600 13px/1.2 var(--sans); }
    button { cursor: pointer; }
    a { color: var(--primary); text-decoration-thickness: 1px; text-underline-offset: 3px; }
    a:hover { color: var(--primary-hover); }
    code, .mono { font-family: var(--mono); font-size: .92em; }
    h1, h2, h3, h4, p { margin-top: 0; }
    h1 { font-size: 23px; letter-spacing: -.025em; line-height: 1.18; margin-bottom: 7px; }
    h2 { font-size: 17px; letter-spacing: -.015em; margin-bottom: 12px; }
    h3 { font-size: 14px; letter-spacing: -.005em; margin-bottom: 8px; }
    ul { margin: 0; padding-left: 19px; }
    li + li { margin-top: 5px; }
    [hidden] { display: none !important; }

    .skip-link {
      position: fixed; z-index: 100; top: 8px; left: 8px; transform: translateY(-160%);
      background: var(--ink); color: #fff; padding: 9px 12px; border-radius: 4px;
    }
    .skip-link:focus { transform: none; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    .topbar {
      height: var(--topbar-height); border-bottom: 1px solid var(--rule);
      display: grid; grid-template-columns: minmax(230px, 1fr) auto minmax(230px, 1fr);
      align-items: stretch; position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,.98);
    }
    .brand {
      display: flex; align-items: center; gap: 10px; padding: 0 22px;
      font-weight: 760; letter-spacing: -.01em; white-space: nowrap;
    }
    .brand-mark {
      width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid var(--ink);
      font: 700 12px/1 var(--mono); color: var(--ink);
    }
    .primary-nav { display: flex; align-items: stretch; }
    .nav-btn {
      position: relative; min-width: 112px; border: 0; background: transparent; padding: 0 20px;
      color: var(--muted); letter-spacing: .035em;
    }
    .nav-btn:hover { color: var(--ink); background: var(--band); }
    .nav-btn[aria-selected="true"] { color: var(--primary); }
    .nav-btn[aria-selected="true"]::after {
      content: ""; position: absolute; left: 20px; right: 20px; bottom: 0; height: 3px; background: var(--primary);
    }
    .topbar-meta { display: flex; align-items: center; justify-content: flex-end; padding: 0 22px; color: var(--muted); }
    .revision-label { font: 600 12px/1 var(--mono); }
    .observation-badge { margin-left: 10px; padding: 4px 7px; border: 1px solid var(--rule-strong); border-radius: 999px; font-size: 11px; font-weight: 720; }
    .observation-badge.is-recorded { color: var(--info); border-color: #b9c8e7; background: #f3f6fc; }
    .observation-badge.is-stale { color: var(--warning); border-color: #e8c790; background: #fff8eb; }

    main { min-height: calc(100vh - var(--topbar-height)); }
    .view { padding: 22px clamp(20px, 2.6vw, 42px) 48px; }
    .view-head {
      display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 18px;
    }
    .eyeless-summary { color: var(--muted); max-width: 820px; margin: 0; }
    .section-rule { border-top: 1px solid var(--rule); padding-top: 18px; margin-top: 18px; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 11px; }
    .section-heading h2, .section-heading h3 { margin: 0; }
    .count { color: var(--muted); font: 600 12px/1 var(--mono); }
    .empty-state { border: 1px dashed var(--rule-strong); color: var(--muted); padding: 24px; text-align: center; }

    .project-strip {
      display: grid; grid-template-columns: minmax(270px, 1.55fr) repeat(5, minmax(120px, .75fr)) minmax(165px, .9fr);
      border: 1px solid var(--rule); border-radius: var(--radius); margin-bottom: 18px; overflow: hidden;
    }
    .project-identity, .meta-cell { min-width: 0; padding: 16px 17px; }
    .meta-cell { border-left: 1px solid var(--rule); }
    .project-identity p { color: var(--muted); margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .meta-label {
      display: block; color: var(--muted); font-size: 11px; font-weight: 720; letter-spacing: .05em;
      text-transform: uppercase; margin-bottom: 7px;
    }
    .meta-value { display: block; font-weight: 720; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .focus-value { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .sensitive-flag { color: var(--critical); font-size: 12px; font-weight: 700; margin-top: 8px; display: flex; gap: 6px; align-items: center; }
    .environment-mini { display: flex; flex-wrap: wrap; gap: 8px 12px; }

    .control-grid { display: grid; grid-template-columns: minmax(0, 2.05fr) minmax(285px, .95fr); gap: 18px; align-items: start; }
    .control-main, .attention-rail { min-width: 0; }
    .framed { border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; background: var(--page); }
    .reviewed-list { list-style: none; padding: 0; }
    .reviewed-item {
      display: grid; grid-template-columns: 5px minmax(0, 1fr); gap: 13px; padding: 13px 15px;
      border-bottom: 1px solid var(--rule); align-items: start;
    }
    .reviewed-item:last-child { border-bottom: 0; }
    .semantic-bar { width: 4px; height: 100%; min-height: 27px; border-radius: 2px; background: var(--primary); }
    .reviewed-item p { margin: 0; }
    .reviewed-meta { color: var(--muted); font-size: 12px; margin-top: 5px; display: flex; gap: 18px; flex-wrap: wrap; }

    .attention-item {
      border-left: 4px solid var(--warning); border-bottom: 1px solid var(--rule); padding: 14px 15px;
    }
    .attention-item:last-child { border-bottom: 0; }
    .attention-item.is-high, .attention-item.is-critical { border-left-color: var(--critical); }
    .attention-item h3 { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .attention-item p { color: var(--muted); margin: 0; }
    .attention-type { font: 600 11px/1 var(--mono); color: var(--faint); text-transform: uppercase; }

    details { border-bottom: 1px solid var(--rule); }
    details:last-child { border-bottom: 0; }
    summary {
      list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 13px 15px; cursor: pointer; font-weight: 720;
    }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: ""; width: 8px; height: 8px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); transition: transform .16s ease; }
    details[open] summary::after { transform: rotate(225deg); }
    .focus-option[open] { box-shadow: inset 3px 0 0 var(--primary); }
    .focus-rank {
      width: 25px; height: 25px; border: 1px solid var(--primary); color: var(--primary);
      display: inline-grid; place-items: center; border-radius: 4px; font: 700 12px/1 var(--mono); flex: 0 0 auto;
    }
    .focus-summary { flex: 1; display: flex; align-items: center; gap: 10px; }
    .recommended {
      color: var(--primary); background: var(--primary-tint); border: 1px solid #d9e0ff;
      padding: 3px 6px; border-radius: 4px; font-size: 11px; letter-spacing: .02em;
    }
    .focus-body { padding: 0 16px 16px 52px; color: var(--muted); }
    .focus-body strong { color: var(--ink); }
    .focus-body-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 22px; margin-top: 12px; }
    .focus-body-grid > div { border-top: 1px solid var(--rule); padding-top: 9px; }
    .focus-body-grid p { margin-bottom: 5px; }

    .filter-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .filter-control, .search-control {
      border: 1px solid var(--rule-strong); border-radius: 5px; background: #fff; min-height: 36px; padding: 0 11px;
    }
    .search-control { min-width: 210px; font-weight: 500; }
    .filter-control { min-width: 145px; }
    .clear-btn, .text-btn {
      border: 0; color: var(--primary); background: transparent; padding: 8px; font-weight: 700;
    }
    .clear-btn:hover, .text-btn:hover { color: var(--primary-hover); text-decoration: underline; text-underline-offset: 3px; }

    .table-wrap { overflow: auto; border: 1px solid var(--rule); border-radius: var(--radius); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left; color: var(--muted); background: var(--band); font-size: 11px; letter-spacing: .035em;
      text-transform: uppercase; padding: 10px 12px; border-bottom: 1px solid var(--rule-strong); white-space: nowrap;
    }
    td { padding: 10px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #fafbff; }
    .selected-row { background: var(--primary-tint) !important; box-shadow: inset 3px 0 0 var(--primary); }
    .cell-title { font-weight: 720; }
    .cell-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .nowrap { white-space: nowrap; }

    .status { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 650; white-space: nowrap; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: 0 0 auto; }
    .tone-passed .status-dot { background: var(--passed); }
    .tone-warning .status-dot { background: var(--warning); }
    .tone-critical .status-dot { background: var(--critical); }
    .tone-info .status-dot { background: var(--primary); }
    .tone-muted .status-dot { background: var(--faint); }
    .severity-text { color: var(--critical); font-weight: 720; }

    .system-shell { padding-top: 0; }
    .subnav {
      display: flex; align-items: stretch; gap: 28px; border-bottom: 1px solid var(--rule); padding: 0 clamp(20px,2.6vw,42px);
      position: sticky; top: var(--topbar-height); background: rgba(255,255,255,.98); z-index: 35;
    }
    .subnav-btn {
      position: relative; border: 0; background: transparent; padding: 16px 0 14px; color: var(--muted);
    }
    .subnav-btn[aria-selected="true"] { color: var(--primary); }
    .subnav-btn[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: var(--primary); }
    .system-mode-switch { margin-left: auto; display: flex; align-items: center; padding-left: 20px; }
    .mode-switch { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 5px; overflow: hidden; background: #fff; }
    .mode-switch-btn { min-height: 32px; border: 0; border-right: 1px solid var(--rule); background: #fff; color: var(--muted); padding: 0 13px; font-size: 12px; }
    .mode-switch-btn:last-child { border-right: 0; }
    .mode-switch-btn[aria-pressed="true"] { color: var(--primary); background: var(--primary-tint); box-shadow: inset 0 0 0 1px var(--primary); }
    .system-content { padding: 18px clamp(20px, 2.6vw, 42px) 48px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
    .segmented { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 5px; overflow: hidden; background: #fff; }
    .segment {
      border: 0; border-right: 1px solid var(--rule); background: #fff; min-height: 35px; min-width: 96px; padding: 0 13px;
      color: var(--muted); font-size: 12px; letter-spacing: .035em;
    }
    .segment:last-child { border-right: 0; }
    .segment[aria-pressed="true"] { color: var(--primary); background: var(--primary-tint); box-shadow: inset 0 0 0 1px var(--primary); }

    .architecture-board {
      border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; position: relative; min-height: 590px; background: #fff;
    }
    .connection-svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; overflow: visible; }
    .connection-path { fill: none; stroke: #67738f; stroke-width: 1.5; opacity: .72; pointer-events: stroke; cursor: pointer; }
    .connection-path.is-target { stroke: var(--primary); stroke-dasharray: 6 5; }
    .connection-path.is-deprecated { stroke: var(--critical); stroke-dasharray: 5 5; }
    .connection-label { fill: var(--muted); font: 600 10px var(--mono); paint-order: stroke; stroke: white; stroke-width: 4px; stroke-linejoin: round; }
    .arch-lane { min-height: 112px; display: grid; grid-template-columns: 135px minmax(0,1fr); border-bottom: 1px dashed var(--rule); position: relative; z-index: 2; }
    .arch-lane:last-child { border-bottom: 0; }
    .lane-title { border-right: 1px solid var(--rule); padding: 16px 14px; background: rgba(247,248,251,.82); }
    .lane-title strong { display: block; margin-bottom: 3px; }
    .lane-title span { color: var(--primary); font: 600 11px/1 var(--mono); }
    .lane-modules { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 24px 42px; padding: 15px 28px; }
    .module-node {
      width: min(225px, 100%); border: 1px solid var(--primary); background: #fff; padding: 11px 12px; border-radius: 5px;
      text-align: left; position: relative; z-index: 3; box-shadow: 0 1px 0 rgba(17,28,58,.04);
    }
    .module-node:hover, .module-node.is-selected { background: var(--primary-tint); box-shadow: inset 0 0 0 1px var(--primary); }
    .module-node.is-related { border-color: var(--ink); box-shadow: 0 0 0 2px rgba(36,72,216,.16); }
    .module-node.is-deprecating { border-color: var(--critical); border-style: dashed; }
    .module-node.is-adding { border-color: var(--primary); border-style: dashed; }
    .module-head { display: flex; align-items: start; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
    .module-name { font-weight: 760; line-height: 1.24; }
    .source-tag { color: var(--muted); font: 700 10px/1 var(--mono); text-transform: uppercase; }
    .module-flags { display: flex; gap: 5px; align-items: center; }
    .flag {
      min-width: 18px; height: 18px; padding: 0 4px; display: inline-grid; place-items: center; border: 1px solid currentColor;
      border-radius: 3px; font: 700 9px/1 var(--mono); color: var(--warning);
    }
    .flag-risk { color: var(--critical); }
    .module-status-grid { border-top: 1px solid var(--rule); padding-top: 6px; display: grid; gap: 3px; }
    .module-status-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 10px; }
    .module-transition-note { color: var(--primary); margin-top: 7px; font-size: 10px; font-style: italic; }
    .is-deprecating .module-transition-note { color: var(--critical); }

    .studio-shell { border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; min-height: 690px; background: #fff; }
    .studio-shell .cell-sub { font-size: 12px; }
    .studio-shell .count { font-size: 12px; }
    .studio-contextbar {
      min-height: 55px; display: flex; align-items: center; justify-content: space-between; gap: 14px;
      padding: 9px 12px; border-bottom: 1px solid var(--rule); background: var(--band); flex-wrap: wrap;
    }
    .studio-context-group, .studio-actions { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
    .studio-context-control { min-height: 44px; border: 1px solid var(--rule-strong); background: #fff; border-radius: 5px; padding: 0 9px; min-width: 140px; font-size: 13px; }
    .studio-action {
      min-height: 44px; border: 1px solid var(--rule-strong); background: #fff; border-radius: 5px; padding: 0 12px;
      color: var(--ink); font-size: 13px;
    }
    .studio-action:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    .studio-action:disabled { cursor: not-allowed; color: var(--faint); background: var(--band-strong); opacity: .72; }
    .studio-action.is-primary { color: #fff; border-color: var(--primary); background: var(--primary); }
    .studio-action.is-danger { color: var(--critical); }
    .studio-status {
      display: inline-flex; align-items: center; gap: 7px; color: #6c4810; border: 1px solid #e8c790;
      background: #fff8eb; padding: 8px 10px; border-radius: 5px; font-size: 12px; font-weight: 720;
    }
    .studio-status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--warning); }
    .studio-status.is-online { color: #245934; border-color: #a9d0b5; background: #f2fbf5; }
    .studio-status.is-online::before { background: var(--passed); }
    .studio-status.is-error, .studio-status.is-conflict { color: var(--critical); border-color: #e0b0b0; background: #fff4f4; }
    .studio-status.is-error::before, .studio-status.is-conflict::before { background: var(--critical); }
    .studio-status.is-busy::before { background: var(--primary); animation: studio-pulse 1s ease-in-out infinite; }
    @keyframes studio-pulse { 50% { opacity: .28; } }
    .studio-candidatebar { padding: 9px 13px; border-bottom: 1px solid var(--rule); display: grid; gap: 8px; background: #fff; }
    .studio-candidate-tabs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .studio-candidate-tab { min-height: 44px; border: 1px solid var(--rule); border-radius: 4px; background: #fff; padding: 0 11px; color: var(--muted); font-size: 13px; }
    .studio-candidate-tab[aria-selected="true"] { border-color: var(--primary); background: var(--primary-tint); color: var(--primary); box-shadow: inset 0 -2px 0 var(--primary); }
    .studio-candidate-compare { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .studio-candidate-chip { display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 0 10px; border: 1px solid var(--rule); border-radius: 4px; color: var(--muted); font-size: 12px; }
    .studio-candidate-chip.is-active { border-color: var(--primary); background: var(--primary-tint); color: var(--primary); }
    .studio-candidate-chip input { accent-color: var(--primary); }
    .studio-compare { padding: 12px 13px; border-bottom: 1px solid var(--rule); background: var(--band); }
    .studio-compare-grid { display: grid; grid-template-columns: repeat(var(--compare-count, 2), minmax(0, 1fr)); gap: 8px; }
    .studio-compare-card { background: #fff; border: 1px solid var(--rule); border-radius: 5px; padding: 10px; min-width: 0; }
    .studio-compare-card h3 { font-size: 12px; margin-bottom: 6px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .studio-compare-card p { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .studio-diff { margin-top: 10px; border-top: 1px solid var(--rule); padding-top: 10px; }
    .studio-diff-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .studio-diff-head strong { font-size: 12px; }
    .studio-diff-summary { display: flex; gap: 7px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
    .studio-diff-group { border: 1px solid var(--rule); border-radius: 4px; background: #fff; margin-top: 6px; }
    .studio-diff-group summary { min-height: 44px; padding: 10px; cursor: pointer; color: var(--ink); font-size: 12px; font-weight: 720; }
    .studio-diff-list { display: grid; gap: 7px; padding: 0 8px 8px; }
    .studio-diff-item { padding: 8px; background: var(--band); border-radius: 3px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .studio-diff-item strong { display: block; color: var(--ink); margin-bottom: 3px; }
    .studio-hash-strip { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; padding: 10px 13px; border-bottom: 1px solid var(--rule); background: #fff; }
    .studio-hash-card { min-width: 0; border: 1px solid var(--rule); border-radius: 4px; padding: 8px; }
    .studio-hash-card header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 5px; }
    .studio-hash-card strong { font-size: 12px; }
    .studio-hash-value { color: var(--muted); font: 12px/1.45 var(--mono); overflow-wrap: anywhere; user-select: all; }
    .studio-hash-state { color: var(--faint); font-size: 12px; margin-top: 4px; }
    .studio-stale-strip { display: flex; align-items: flex-start; gap: 9px; padding: 9px 13px; border-bottom: 1px solid #e1c98f; background: #fff8eb; color: #6c4810; }
    .studio-stale-strip strong { flex: 0 0 auto; font-size: 12px; }
    .studio-stale-list { display: flex; flex-wrap: wrap; gap: 5px; list-style: none; padding: 0; }
    .studio-stale-list li { border: 1px solid #e1c98f; border-radius: 999px; background: #fff; padding: 3px 8px; font: 12px/1.45 var(--mono); }
    .studio-artifact-strip { display: grid; gap: 7px; padding: 10px 13px; border-bottom: 1px solid var(--rule); background: #fff; }
    .studio-artifact-line { display: flex; align-items: flex-start; gap: 8px; color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
    .studio-artifact-line strong { color: var(--ink); min-width: 72px; }
    .studio-artifact-line.is-stale { color: #7a5712; }
    .studio-artifact-line.is-error { color: var(--critical); }

      if (error.payload && error.payload.error) {
        if (typeof error.payload.error === "string") return error.payload.error;
        return error.payload.error.message || error.payload.error.code || JSON.stringify(error.payload.error);
      }
      return error.message || String(error);
    }

    async function studioBridgeRequest(path, options) {
      if (!state.studioBridge.capability) throw new Error("当前页面没有 Bridge capability");
      options = options || {};
      var method = String(options.method || "GET").toUpperCase();
      var headers = { "Accept": "application/json", "X-Panorama-Capability": state.studioBridge.capability };
      if (method !== "GET" && method !== "HEAD") {
        headers["Content-Type"] = "application/json";
        if (!state.studioBridge.csrfToken) throw new Error("Bridge 尚未建立 CSRF 会话");
        headers["X-Panorama-CSRF"] = state.studioBridge.csrfToken;
      }
      var response;
      try {
        response = await window.fetch(path, { method: method, headers: headers, body: options.body === undefined ? undefined : JSON.stringify(options.body), credentials: "same-origin", cache: "no-store" });
      } catch (error) {
        state.studioBridge.status = "error";
        state.studioBridge.detached = true;
        state.studioBridge.notice = "Bridge 连接中断；本地草稿保持 detached，重连时将使用 CAS 保存";
        throw error;
      }
      var payload;
      try { payload = await response.json(); }
      catch (error) { throw new Error("Bridge 返回了非 JSON 响应（HTTP " + response.status + "）"); }
      if (!response.ok || payload.ok === false) {
        var failure = new Error((payload.error && (payload.error.message || payload.error.code)) || "Bridge 请求失败（HTTP " + response.status + "）");
        failure.status = response.status; failure.payload = payload; throw failure;
      }
      return payload && Object.prototype.hasOwnProperty.call(payload, "data") ? payload.data : payload;
    }

    async function connectStudioBridge() {
      if (!state.studioBridge.capability) return;
      state.studioBridge.status = "connecting"; state.studioBridge.busy = "连接 Bridge"; state.studioBridge.lastError = null;
      if (state.studioMode === "studio") scheduleStudioRender();
      try {
        var healthEnvelope = await window.fetch("/api/v1/health", { headers: { "Accept": "application/json", "X-Panorama-Capability": state.studioBridge.capability }, credentials: "same-origin", cache: "no-store" });
        var healthPayload = await healthEnvelope.json();
        if (!healthEnvelope.ok || healthPayload.ok === false) throw new Error((healthPayload.error && healthPayload.error.message) || "Bridge health 检查失败");
        var health = healthPayload.data || healthPayload;
        if (!health.csrfToken) throw new Error("Bridge 未返回 CSRF token");
        state.studioBridge.csrfToken = health.csrfToken;
        state.studioBridge.features = health.features || {};
        state.studioBridge.agent = health.agent || null;
        state.studioBridge.context = await studioBridgeRequest("/api/v1/context");
        state.studioBridge.status = "online";
        state.studioBridge.busy = "连接服务端会话";
        await connectOrCreateStudioSession();
      } catch (error) {
        state.studioBridge.status = "error";
        state.studioBridge.lastError = studioBridgeErrorMessage(error);
      } finally {
        state.studioBridge.busy = null;
        if (state.studioMode === "studio") scheduleStudioRender();
        else if (state.view === "system" && state.systemView === "source") renderSource();
      }
    }

    async function connectOrCreateStudioSession() {
      if (!studioBridgeOnline() || !studioBridgeFeature("sessions")) return;
      var current = state.studioSession || loadStudioSession();
      if (current && !state.studioSession) state.studioSession = current;
      if (current && current.mode === "bridge" && current.sessionId) {
        try {
          var preserved = await studioBridgeRequest("/api/v1/sessions/" + encodeURIComponent(current.sessionId), { method: "PUT", body: { expectedRevision: Number(current.sessionRevision || 0), session: current } });
          acceptServerStudioSession((preserved && preserved.session) || preserved);
          state.studioBridge.detached = false; state.studioBridge.conflict = null;
          state.studioBridge.notice = "本地草稿已通过 Session Revision CAS 重连；未从服务端静默覆盖";
          return;
        } catch (error) {
          if (error.status === 409) {
            state.studioBridge.detached = true;
            state.studioBridge.conflict = studioBridgeErrorMessage(error);
            addStudioStaleReason("session_cas_conflict");
            state.studioBridge.notice = "本地草稿仍保留；请选择导出备份或显式加载服务端版本";
            return;
          }
          if (error.status !== 404) throw error;
        }
      }
      var created = await studioBridgeRequest("/api/v1/sessions", { method: "POST", body: {} });
      acceptServerStudioSession((created && created.session) || created);
    }

    function acceptServerStudioSession(session) {
      if (!studioSessionShapeValid(session)) throw new Error("Bridge 返回的 session 结构无效");
      session.mode = "bridge";
      state.studioSession = session;
      state.studioStorage = "bridge";
      state.studioBridge.lastSavedGeneration = Math.max(state.studioBridge.lastSavedGeneration, state.studioGeneration);
      if (!state.studioBridge.conflict) removeStudioStaleReasons(["session_cas_conflict"]);
      state.studioUndoStack = []; state.studioRedoStack = [];
      var candidate = activeStudioCandidate();
      state.studioSelectedNodeId = candidate && candidate.nodes[0] ? candidate.nodes[0].nodeId : null;
      validateStudioSession();
      try { window.localStorage.setItem(studioStorageKey(), JSON.stringify(session)); } catch (error) { /* Bridge is authoritative. */ }
    }

    function markStudioLocalMutation() {
      state.studioGeneration += 1;
      if (state.studioBridge.capability && !studioBridgeOnline()) {
        state.studioBridge.detached = true;
        state.studioBridge.notice = "Bridge 已断开；本地草稿已保留，重连时不会自动覆盖";
      }
    }

    function addStudioStaleReason(reason) {
      if (reason && state.studioEventStaleReasons.indexOf(reason) < 0) state.studioEventStaleReasons.push(reason);
    }

    function removeStudioStaleReasons(reasons) {
      state.studioEventStaleReasons = state.studioEventStaleReasons.filter(function (item) { return reasons.indexOf(item) < 0; });
    }

    function invalidateStudioArtifacts(reason) {
      addStudioStaleReason(reason || "candidate_semantic_changed");
      state.studioBridge.formalValidation = null;
      state.studioBridge.review = null;
      if (state.studioBridge.reviewJobId && String(state.studioBridge.busy || "").indexOf("Codex") >= 0) state.studioBridge.busy = null;
      state.studioBridge.reviewJobId = null;
      state.studioBridge.reviewRequest = null;
      state.studioBridge.reviewError = null;
      state.studioBridge.proposal = null;
      state.studioBridge.proposalDraft = null;
      state.studioBridge.approval = null;
      state.studioBridge.applyResult = null;
      if (!state.studioSession) return;
      ["formalValidation", "reviewArtifact", "proposalArtifact"].forEach(function (key) { if (key in state.studioSession) state.studioSession[key] = null; });
    }

    function scheduleStudioBridgeSave() {
      if (!studioBridgeOnline() || !state.studioSession || state.studioSession.mode !== "bridge") return;
      window.clearTimeout(state.studioSaveTimer);
      state.studioSaveTimer = window.setTimeout(function () {
        if (state.studioBridge.sessionMutationBusy) { scheduleStudioBridgeSave(); return; }
        saveStudioSessionToBridge(false);
      }, 450);
    }

    async function saveStudioSessionToBridge(explicit) {
      if (!studioBridgeOnline() || !studioBridgeFeature("sessions") || !state.studioSession) return false;
      if (state.studioBridge.sessionMutationBusy) { scheduleStudioBridgeSave(); return false; }
      if (state.studioBridge.savePromise) {
        await state.studioBridge.savePromise;
        if (state.studioBridge.conflict) return false;
        if (state.studioBridge.lastSavedGeneration < state.studioGeneration) return saveStudioSessionToBridge(explicit);
        return true;
      }
      window.clearTimeout(state.studioSaveTimer);
      state.studioBridge.busy = "保存草稿"; state.studioBridge.lastError = null;
      if (explicit) renderStudio();
      var expected = Number(state.studioSession.sessionRevision || 0);
      var requestGeneration = state.studioGeneration;
      var outgoing = cloneForStudio(state.studioSession);
      state.studioBridge.savePromise = (async function () {
        try {
          var result = await studioBridgeRequest("/api/v1/sessions/" + encodeURIComponent(outgoing.sessionId), { method: "PUT", body: { expectedRevision: expected, session: outgoing } });
          var saved = (result && result.session) || result;
          state.studioBridge.lastSavedGeneration = requestGeneration;
          if (state.studioGeneration === requestGeneration) acceptServerStudioSession(saved);
          else {
            state.studioSession.sessionRevision = saved.sessionRevision;
            state.studioBridge.notice = "保存期间检测到新编辑；旧响应未覆盖本地草稿，正在继续保存";
            scheduleStudioBridgeSave();
          }
          state.studioBridge.conflict = null; state.studioBridge.detached = false;
          if (explicit) showToast("服务端草稿已保存");
          return true;
        } catch (error) {
          if (error.status === 409) { state.studioBridge.conflict = studioBridgeErrorMessage(error); addStudioStaleReason("session_cas_conflict"); }
          else state.studioBridge.lastError = studioBridgeErrorMessage(error);
          return false;
        }
      }());
      try { return await state.studioBridge.savePromise; }
      finally {
        state.studioBridge.savePromise = null;
        state.studioBridge.busy = null;
        if (state.studioMode === "studio") scheduleStudioRender();
      }
    }

    async function reloadStudioSessionFromBridge() {
      if (!studioBridgeOnline() || !state.studioSession) return;
      state.studioBridge.busy = "加载服务端草稿"; renderStudio();
      try {
        var result = await studioBridgeRequest("/api/v1/sessions/" + encodeURIComponent(state.studioSession.sessionId));
        state.studioBridge.conflict = null; removeStudioStaleReasons(["session_cas_conflict"]); acceptServerStudioSession((result && result.session) || result);
        showToast("已加载服务端最新草稿");
      } catch (error) { state.studioBridge.lastError = studioBridgeErrorMessage(error); }
      finally { state.studioBridge.busy = null; renderStudio(); }
    }

    function studioStorageKey() {
      return "panorama.architecture-studio.v0.1:" + data.project.id;
    }

    function studioSessionShapeValid(session) {
      if (!session || session.format !== "panorama-architecture-session.v0.1") return false;
      if (!session.projectBinding || session.projectBinding.projectId !== data.project.id) return false;
      if (session.sessionRevision != null && (!Number.isInteger(session.sessionRevision) || session.sessionRevision < 0)) return false;
      if (!Array.isArray(session.layers) || !Array.isArray(session.candidates) || !session.candidates.length || session.candidates.length > 12) return false;
      var totalNodes = 0;
      var totalEdges = 0;
      for (var index = 0; index < session.candidates.length; index += 1) {
        var candidate = session.candidates[index];
        if (!candidate || typeof candidate.candidateId !== "string" || !Array.isArray(candidate.nodes) || !Array.isArray(candidate.edges)) return false;
        totalNodes += candidate.nodes.length;
        totalEdges += candidate.edges.length;
        if (totalNodes > 200 || totalEdges > 400) return false;
      }
      if (!Array.isArray(session.semanticOperations) || !Array.isArray(session.layoutOperations)) return false;
      return true;
    }

    function loadStudioSession() {
      try {
        var serialized = window.localStorage.getItem(studioStorageKey());
        if (!serialized) return null;
        var restored = JSON.parse(serialized);
        if (!studioSessionShapeValid(restored)) return null;
        if (!state.studioBridge.capability && restored.mode === "bridge") restored.mode = "offline";
        if (restored.projectBinding.baseRevision !== data.meta.revision || (restored.projectBinding.gitHead || null) !== ((data.sourceBinding && data.sourceBinding.gitHead) || null)) {
          restored.status = "stale";
        }
        state.studioStorage = "local";
        return restored;
      } catch (error) {
        state.studioStorage = "memory";
        return null;
      }
    }

    function persistStudioSession() {
      if (!state.studioSession) return;
      markStudioLocalMutation();
      state.studioSession.updatedAt = new Date().toISOString();
      try {
        window.localStorage.setItem(studioStorageKey(), JSON.stringify(state.studioSession));
        state.studioStorage = "local";
      } catch (error) {
        state.studioStorage = "memory";
      }
      scheduleStudioBridgeSave();
    }

    function createStudioSession() {
      var layers = cloneForStudio(arr(data.architecture.layers).slice().sort(function (a, b) { return a.order - b.order; }));
      var modules = cloneForStudio(arr(data.architecture.modules).filter(function (module) {
        return ["target", "both"].indexOf(module.architectureScope) >= 0;
      }));
      if (!modules.length) modules = cloneForStudio(arr(data.architecture.modules));
      var layerIndex = {};
      layers.forEach(function (layer, index) { layerIndex[layer.id] = index; });
      var laneCounts = {};
      var nodes = modules.map(function (module) {
        var layerId = module.targetLayerId || module.layerId || (layers[0] && layers[0].id);
        var lane = layerIndex[layerId] == null ? 0 : layerIndex[layerId];
        var slot = laneCounts[layerId] || 0;
        laneCounts[layerId] = slot + 1;
        var design = module.targetDesign || module.currentDesign || {};
        return {
          nodeId: "NODE-" + module.id,
          entityRef: { type: "module", id: module.id },
          name: module.name,
          purpose: module.purpose || "",
          responsibilities: cloneForStudio(arr(design.responsibilities)),
          stateOwnership: design.stateOwnership || "",
          layerId: layerId,
          category: module.category || "supporting",
          isDraft: false,
          x: 145 + (slot % 3) * 205,
          y: 20 + lane * 122 + Math.floor(slot / 3) * 86
        };
      });
      var nodeByEntity = {};
      nodes.forEach(function (node) { nodeByEntity[node.entityRef.id] = node.nodeId; });
      var edges = cloneForStudio(arr(data.architecture.connections)).filter(function (connection) {
        return nodeByEntity[connection.fromModuleId] && nodeByEntity[connection.toModuleId] && ["target", "both"].indexOf(connection.architectureScope) >= 0;
      }).map(function (connection) {
        return {
          edgeId: "EDGE-" + connection.id,
          entityRef: { type: "connection", id: connection.id },
          fromNodeId: nodeByEntity[connection.fromModuleId],
          toNodeId: nodeByEntity[connection.toModuleId],
          label: connection.protocol || connection.communicationMode || "data",
          dataSummary: connection.dataSummary || "",
          isDraft: false
        };
      });
      var now = new Date().toISOString();
      return {
        format: "panorama-architecture-session.v0.1",
        sessionId: "SESSION-" + data.project.id + "-" + String(Date.now()),
        sessionRevision: 0,
        projectBinding: {
          projectId: data.project.id,
          schemaVersion: data.schemaVersion,
          templateVersion: data.meta.templateVersion,
          baseRevision: data.meta.revision,
          // file:// cannot authoritatively compute the canonical Panorama Data Hash.
          // Bridge sessions replace this null with a server-computed binding before
          // any formal validation, Proposal or Apply operation is enabled.
          baseDataHash: null,
          gitHead: (data.sourceBinding && data.sourceBinding.gitHead) || null,
          sourceSnapshotHash: (data.sourceBinding && data.sourceBinding.sourceSnapshotHash) || null
        },
        sourceObservation: { observedAt: null, actualGitHead: null, boundGitHead: (data.sourceBinding && data.sourceBinding.gitHead) || null, formalSourceBindingPresent: Boolean(data.sourceBinding), driftStatus: "not_observed" },
        mode: "offline",
        status: "draft",
        scope: { level: "project", subjectRefs: [{ type: "project", id: data.project.id }] },
        layers: layers,
        candidates: [{ candidateId: "CANDIDATE-BASE", label: "目标架构副本", kind: "baseline_copy", status: "active", assumptions: [], unknowns: [], nodes: nodes, edges: edges, createdAt: now, updatedAt: now }],
        activeCandidateId: "CANDIDATE-BASE",
        semanticOperations: [],
        layoutOperations: [],
        clientValidation: [],
        semanticHash: null,
        layoutHash: null,
        createdAt: now,
        updatedAt: now
      };
    }

    function ensureStudioSession() {
      if (state.studioSession) return state.studioSession;
      state.studioSession = loadStudioSession() || createStudioSession();
      var candidate = activeStudioCandidate();
      state.studioSelectedNodeId = candidate && candidate.nodes.length ? candidate.nodes[0].nodeId : null;
      validateStudioSession();
      return state.studioSession;
    }

    function activeStudioCandidate() {
      if (!state.studioSession) return null;
      return arr(state.studioSession.candidates).find(function (candidate) { return candidate.candidateId === state.studioSession.activeCandidateId && candidate.status !== "archived"; }) || arr(state.studioSession.candidates).find(function (candidate) { return candidate.status !== "archived"; }) || null;
    }

    function studioNode(nodeId) {
      var candidate = activeStudioCandidate();
      return candidate ? arr(candidate.nodes).find(function (node) { return node.nodeId === nodeId; }) : null;
    }

    function studioSnapshot() {
      return cloneForStudio({ session: state.studioSession, selected: state.studioSelectedNodeId });
    }

    function studioSemanticProjection(session) {
      return JSON.stringify({
        scope: session && session.scope,
        activeCandidateId: session && session.activeCandidateId,
        candidates: arr(session && session.candidates).map(function (candidate) {
          return {
            candidateId: candidate.candidateId, label: candidate.label, kind: candidate.kind, status: candidate.status,
            assumptions: candidate.assumptions, unknowns: candidate.unknowns,
            nodes: arr(candidate.nodes).map(function (node) { var copy = cloneForStudio(node); delete copy.x; delete copy.y; return copy; }),
            edges: candidate.edges
          };
        })
      });
    }

    function restoreStudioSnapshot(snapshot) {
      var semanticChanged = studioSemanticProjection(state.studioSession) !== studioSemanticProjection(snapshot.session);
      state.studioSession = cloneForStudio(snapshot.session);
      state.studioSelectedNodeId = snapshot.selected;
      if (semanticChanged) invalidateStudioArtifacts("candidate_semantic_changed");
      validateStudioSession();
      persistStudioSession();
      renderStudio();
    }

    function pushStudioUndo() {
      state.studioUndoStack.push(studioSnapshot());
      if (state.studioUndoStack.length > 40) state.studioUndoStack.shift();
      state.studioRedoStack = [];
    }

    function appendStudioOperation(kind, target, before, after, semantic) {
      var list = semantic ? state.studioSession.semanticOperations : state.studioSession.layoutOperations;
      var operationTarget = cloneForStudio(target || {});
      if (!operationTarget.candidateId) operationTarget.candidateId = state.studioSession.activeCandidateId;
      list.push({
        opId: "OP-" + String(Date.now()) + "-" + String(list.length + 1),
        seq: state.studioSession.semanticOperations.length + state.studioSession.layoutOperations.length + 1,
        at: new Date().toISOString(),
        actor: "human",
        kind: kind,
        target: operationTarget,
        before: before,
        after: after,
        affectsSemanticHash: Boolean(semantic)
      });
      if (state.studioSession.status !== "stale") state.studioSession.status = "dirty";
      if (semantic) invalidateStudioArtifacts("candidate_semantic_changed");
    }

    function validateStudioSession() {
      if (!state.studioSession) return [];
      var candidate = activeStudioCandidate();
      var checks = [];
      if (!candidate) return checks;
      var ids = new Set();
      candidate.nodes.forEach(function (node) {
        if (!node.name.trim()) checks.push({ level: "error", message: node.nodeId + " 缺少名称" });
        if (!node.layerId) checks.push({ level: "error", message: node.name + " 缺少架构层" });
        if (!node.purpose.trim()) checks.push({ level: "warning", message: node.name + " 缺少用途描述" });
        if (!node.stateOwnership.trim()) checks.push({ level: "warning", message: node.name + " 未说明状态所有权" });
        if (ids.has(node.nodeId)) checks.push({ level: "error", message: "草稿节点标识重复：" + node.nodeId });
        ids.add(node.nodeId);
      });
      var edgeKeys = new Set();
      candidate.edges.forEach(function (edge) {
        if (!ids.has(edge.fromNodeId) || !ids.has(edge.toNodeId)) checks.push({ level: "error", message: edge.edgeId + " 的端点不存在" });
        if (edge.fromNodeId === edge.toNodeId) checks.push({ level: "warning", message: edge.edgeId + " 是自循环" });
        var key = edge.fromNodeId + "->" + edge.toNodeId;
        if (edgeKeys.has(key)) checks.push({ level: "warning", message: "存在重复数据流：" + key });
        edgeKeys.add(key);
        if (!String(edge.dataSummary || "").trim()) checks.push({ level: "warning", message: edge.edgeId + " 缺少数据说明" });
      });
      var linked = new Set();
      candidate.edges.forEach(function (edge) { linked.add(edge.fromNodeId); linked.add(edge.toNodeId); });
      candidate.nodes.forEach(function (node) {
        if (candidate.nodes.length > 1 && !linked.has(node.nodeId)) checks.push({ level: "warning", message: node.name + " 当前没有连接" });
      });
      checks.forEach(function (check, index) {
        if (!check.code) check.code = "CLIENT_BROWSER_CHECK";
        if (!check.candidateId) check.candidateId = candidate.candidateId;
        if (!check.path) check.path = "/clientValidation/" + index;
      });
      state.studioSession.clientValidation = checks;
      return checks;
    }

    function studioCheckHtml() {
      var checks = state.studioSession.clientValidation;
      if (!checks.length) return "<li class='studio-check-item'>浏览器基础检查通过</li>";
      return checks.slice(0, 8).map(function (check) {
        return "<li class='studio-check-item is-" + e(check.level) + "'>" + e(check.message) + "</li>";
      }).join("");
    }

    function studioFullHash(value) {
      return /^[a-f0-9]{64}$/.test(String(value || "")) ? String(value) : null;
    }

    function studioHashStripHtml(session) {
      var authoritative = session.mode === "bridge" && state.studioStorage === "bridge" && state.studioBridge.lastSavedGeneration >= state.studioGeneration;
      var semantic = authoritative ? studioFullHash(session.semanticHash) : null;
      var layout = authoritative ? studioFullHash(session.layoutHash) : null;
      function card(label, value, explanation) {
        var shown = value || "not_computed_by_bridge";
        return "<article class='studio-hash-card'><header><strong>" + e(label) + "</strong>" + (value ? "<button class='studio-action' type='button' data-copy-value='" + e(value) + "'>复制</button>" : "") + "</header><div class='studio-hash-value'>" + e(shown) + "</div><div class='studio-hash-state'>" + e(explanation) + "</div></article>";
      }
      return "<section class='studio-hash-strip' aria-label='Bridge 权威双 Hash'>" +
        card("Semantic Hash", semantic, semantic ? "Bridge 权威值 · 语义编辑会改变" : "离线页面不计算权威 Hash") +
        card("Layout Hash", layout, layout ? "Bridge 权威值 · 仅布局坐标会改变" : "离线页面不计算权威 Hash") + "</section>";
    }

    function studioStaleReasonLabel(reason) {
      var labels = {
        candidate_semantic_changed: "candidate_semantic_changed · 候选语义已编辑",
        candidate_switched: "candidate_switched · 已切换活动候选",
        panorama_revision_changed: "panorama_revision_changed · Panorama Revision 已变化",
        data_hash_changed: "data_hash_changed · Data Hash 已变化",
        git_head_changed: "git_head_changed · Git HEAD 已漂移",
        bridge_baseline_git_changed: "git_head_changed · Bridge 启动后 Git HEAD 已变化",
        source_snapshot_changed: "source_snapshot_changed · Source Snapshot 已漂移",
        source_content_changed: "source_content_changed · Source Content Digest 已漂移",
        session_cas_conflict: "session_cas_conflict · Session Revision 冲突",
        coverage_incomplete: "coverage_incomplete · 来源覆盖不完整",
        formal_source_uninitialized: "formal_source_uninitialized · 正式 Source Binding 未初始化",
        formal_source_unbound: "formal_source_unbound · V0.1 未绑定正式 Source，由 Bridge live baseline 锚定（不阻断）"
      };
      return labels[reason] || reason;
    }

    function studioStaleReasons() {
      var reasons = state.studioEventStaleReasons.slice();
      var session = state.studioSession;
      var context = state.studioBridge.context || {};
      var panorama = context.panorama || {};
      var freshness = context.sourceFreshness || {};

    function studioSemanticDiff(base, compare) {
      var nodeFields = ["name", "purpose", "responsibilities", "nonResponsibilities", "stateOwnership", "layerId", "category", "technologies", "dataHandled", "interfaceSummary", "deploymentRole", "referenceIds", "notes", "designExtensions", "rationale", "requirementIds", "isDraft"];
      var edgeFields = ["fromNodeRef", "toNodeRef", "name", "label", "protocol", "communicationMode", "flowDirection", "dataSummary", "contractReferenceIds", "authSummary", "reliabilitySummary", "rationale", "transitionId", "extensions", "isDraft"];
      function fieldChanges(before, after, fields) {
        return fields.filter(function (field) { return JSON.stringify(before[field]) !== JSON.stringify(after[field]); }).map(function (field) { return { field: field, before: cloneForStudio(before[field]), after: cloneForStudio(after[field]) }; });
      }
      function nodeMap(candidate) {
        var result = {};
        arr(candidate.nodes).forEach(function (node) { result[studioSemanticIdentity(node, "nodeId", "node")] = node; });
        return result;
      }
      function edgeMap(candidate) {
        var refs = {};
        arr(candidate.nodes).forEach(function (node) { refs[node.nodeId] = studioSemanticIdentity(node, "nodeId", "node"); });
        var result = {};
        arr(candidate.edges).forEach(function (edge) {
          var copy = cloneForStudio(edge);
          copy.fromNodeRef = refs[edge.fromNodeId] || "node:" + edge.fromNodeId;
          copy.toNodeRef = refs[edge.toNodeId] || "node:" + edge.toNodeId;
          result[studioSemanticIdentity(edge, "edgeId", "edge")] = copy;
        });
        return result;
      }
      function entityDiff(beforeMap, afterMap, fields) {
        var beforeKeys = Object.keys(beforeMap);
        var afterKeys = Object.keys(afterMap);
        var modified = beforeKeys.filter(function (key) { return Object.prototype.hasOwnProperty.call(afterMap, key); }).map(function (key) { return { identity: key, fields: fieldChanges(beforeMap[key], afterMap[key], fields) }; }).filter(function (item) { return item.fields.length; });
        return {
          added: afterKeys.filter(function (key) { return !Object.prototype.hasOwnProperty.call(beforeMap, key); }).sort(),
          removed: beforeKeys.filter(function (key) { return !Object.prototype.hasOwnProperty.call(afterMap, key); }).sort(),
          modified: modified.sort(function (a, b) { return a.identity.localeCompare(b.identity); })
        };
      }
      return {
        candidateFields: fieldChanges(base, compare, ["assumptions", "unknowns"]),
        nodes: entityDiff(nodeMap(base), nodeMap(compare), nodeFields),
        edges: entityDiff(edgeMap(base), edgeMap(compare), edgeFields)
      };
    }

    }

    function studioDiffEntityGroup(label, diff) {
      var count = diff.added.length + diff.removed.length + diff.modified.length;
      if (!count) return "";
      var rows = diff.added.map(function (identity) { return "<div class='studio-diff-item'><strong>＋ " + e(identity) + "</strong>新增实体</div>"; })
        .concat(diff.removed.map(function (identity) { return "<div class='studio-diff-item'><strong>－ " + e(identity) + "</strong>移除实体</div>"; }))
        .concat(diff.modified.map(function (item) { return "<div class='studio-diff-item'><strong>△ " + e(item.identity) + "</strong>" + item.fields.map(function (change) { return "<div><span class='mono'>" + e(change.field) + "</span><br>before: " + e(studioDiffValue(change.before)) + "<br>after: " + e(studioDiffValue(change.after)) + "</div>"; }).join("<br>") + "</div>"; }));
      return "<details class='studio-diff-group' open><summary>" + e(label) + " · " + count + "</summary><div class='studio-diff-list'>" + rows.join("") + "</div></details>";
    }

    function studioCompareHtml(session) {

      var selected = state.studioCompareIds.map(function (id) { return session.candidates.find(function (item) { return item.candidateId === id; }); }).filter(Boolean).slice(0, 3);
      if (selected.length < 2) return "";
      var base = selected[0];
      var comparisons = selected.slice(1).map(function (candidate) {
        var diff = studioSemanticDiff(base, candidate);
        var candidateRows = diff.candidateFields.map(function (change) { return "<div class='studio-diff-item'><strong>△ candidate." + e(change.field) + "</strong>before: " + e(studioDiffValue(change.before)) + "<br>after: " + e(studioDiffValue(change.after)) + "</div>"; });
        var nodeCount = diff.nodes.added.length + diff.nodes.removed.length + diff.nodes.modified.length;

    async function pollStudioReviewJob(jobId, requestBinding) {
      if (!jobId || state.studioBridge.reviewJobId !== jobId) return;
      if (!studioRequestIsCurrent(requestBinding)) { state.studioBridge.reviewJobId = null; state.studioBridge.busy = null; state.studioBridge.notice = "候选已变化；旧 Codex 评审结果将被忽略"; renderStudio(); return; }
      try {
        var job = await studioBridgeRequest("/api/v1/jobs/" + encodeURIComponent(jobId));
        job = job.job || job;
        if (["queued", "pending", "running"].indexOf(job.status) >= 0) {
          state.studioBridge.busy = "Codex 只读评审中"; renderStudio();
          window.setTimeout(function () { pollStudioReviewJob(jobId, requestBinding); }, 1000); return;
        }
        if (!studioRequestIsCurrent(requestBinding)) { state.studioBridge.reviewJobId = null; state.studioBridge.notice = "候选已变化；旧 Codex 评审结果已丢弃"; return; }
        state.studioBridge.busy = null;
        if (job.status === "completed" || job.status === "succeeded" || job.result) {
          state.studioBridge.review = { status: job.status, result: job.result || job }; state.studioBridge.reviewError = null;
          state.studioBridge.reviewJobId = null; showToast("Codex 只读评审已完成");
        } else {
          state.studioBridge.reviewJobId = null; state.studioBridge.reviewError = job.error && (job.error.message || job.error) || "Codex 评审失败";
        }

    }

    function renderStudio() {
      var session = ensureStudioSession();

      if (!candidate) {
        document.getElementById("system-content").innerHTML = "<div class='error-banner'>当前 Studio session 没有可用候选方案。</div>";
        return;
      }
      var layers = arr(session.layers).slice().sort(function (a, b) { return a.order - b.order; });
      var surfaceHeight = Math.max(620, layers.length * 122);
      var bands = layers.map(function (layer, index) {
        return "<div class='studio-layer-band' style='top:" + (index * 122) + "px;height:122px'><div class='studio-layer-label'><strong>" + e(layer.name) + "</strong><span class='mono'>" + e(layer.id) + "</span></div></div>";
      }).join("");

    function updateStudioCandidateField(field, value) {
      var candidate = activeStudioCandidate();

      var before = cloneForStudio(arr(candidate[field]));
      var normalized = String(value).split(/\r?\n/).map(function (item) { return item.trim(); }).filter(Boolean);
      if (JSON.stringify(before) === JSON.stringify(normalized)) return;
      pushStudioUndo(); candidate[field] = normalized; candidate.updatedAt = new Date().toISOString();
      appendStudioOperation("candidate.update", { candidateId: candidate.candidateId, field: field }, before, cloneForStudio(normalized), true);
      validateStudioSession(); persistStudioSession(); renderStudio();
    }

    function updateStudioEdgeField(field, value) {
      var candidate = activeStudioCandidate();
      var edge = candidate && candidate.edges.find(function (item) { return item.edgeId === state.studioSelectedEdgeId; });
      if (!edge || ["label", "protocol", "communicationMode", "flowDirection", "dataSummary", "reliabilitySummary"].indexOf(field) < 0) return;
      var before = cloneForStudio(edge[field]);
      var normalized = String(value);
      if (before === normalized) return;
      pushStudioUndo(); edge[field] = normalized; candidate.updatedAt = new Date().toISOString();
      appendStudioOperation("edge.update", { edgeId: edge.edgeId, field: field }, before, normalized, true);
      validateStudioSession(); persistStudioSession(); renderStudio();
    }

    function drawStudioEdges() {
      var surface = document.getElementById("studio-canvas-surface");
      var svg = document.getElementById("studio-edge-svg");

      if (!surface || !svg || !candidate) return;

      svg.setAttribute("viewBox", "0 0 " + width + " " + height);
      svg.setAttribute("height", height);
      var defs = "<defs><marker id='studio-arrow' markerWidth='8' markerHeight='8' refX='7' refY='3.5' orient='auto'><path d='M0,0 L7,3.5 L0,7 z' fill='#67738f'/></marker><marker id='studio-arrow-draft' markerWidth='8' markerHeight='8' refX='7' refY='3.5' orient='auto'><path d='M0,0 L7,3.5 L0,7 z' fill='#2448d8'/></marker></defs>";
      var paths = candidate.edges.map(function (edge) {
        var from = studioNode(edge.fromNodeId);
        var to = studioNode(edge.toNodeId);

        var x1 = Number(from.x) + 88;
        var y1 = Number(from.y) + 78;
        var x2 = Number(to.x) + 88;

      }).join("");
      svg.innerHTML = defs + paths;
    }

    function addStudioNode(kind) {
      var candidate = activeStudioCandidate();
      if (!candidate) return;
      pushStudioUndo();
      var layers = state.studioSession.layers;
      var layerId = kind === "data" ? layers[layers.length - 1].id : (kind === "agent" && layers.length > 2 ? layers[2].id : layers[Math.min(1, layers.length - 1)].id);
      var layerIndex = layers.findIndex(function (layer) { return layer.id === layerId; });
      var layerSlot = candidate.nodes.filter(function (item) { return item.layerId === layerId; }).length;
      var nodeId = "DRAFT-NODE-" + String(Date.now());
      var node = { nodeId: nodeId, entityRef: null, name: kind === "agent" ? "新 Agent" : (kind === "data" ? "新数据存储" : "新服务"), purpose: "", responsibilities: [], stateOwnership: "", layerId: layerId, category: kind, isDraft: true, x: 145 + (layerSlot % 3) * 205, y: 20 + Math.max(0, layerIndex) * 122 + Math.floor(layerSlot / 3) * 86 };
      candidate.nodes.push(node);
      state.studioSelectedNodeId = nodeId;
      appendStudioOperation("node.add", { nodeId: nodeId }, null, cloneForStudio(node), true);
      validateStudioSession(); persistStudioSession(); renderStudio();
    }

    function updateStudioField(field, value, capturedBefore) {
      var node = studioNode(state.studioSelectedNodeId);
      if (!node) return;
      var before = capturedBefore === undefined ? cloneForStudio(node[field]) : cloneForStudio(capturedBefore);
      var normalized = field === "responsibilities" ? String(value).split(/\r?\n/).map(function (item) { return item.trim(); }).filter(Boolean) : String(value);
      if (JSON.stringify(before) === JSON.stringify(normalized)) return;
      node[field] = before;
      pushStudioUndo();
      node[field] = normalized;
      if (field === "layerId") {
        var index = state.studioSession.layers.findIndex(function (layer) { return layer.id === normalized; });
        var candidate = activeStudioCandidate();
        var slot = candidate.nodes.filter(function (item) { return item.nodeId !== node.nodeId && item.layerId === normalized; }).length;
        node.x = 145 + (slot % 3) * 205;
        node.y = 20 + Math.max(0, index) * 122 + Math.floor(slot / 3) * 86;
      }
      appendStudioOperation(field === "layerId" ? "node.change_layer" : "node.update", { nodeId: node.nodeId, field: field }, before, cloneForStudio(normalized), true);
      validateStudioSession(); persistStudioSession(); renderStudio();
    }

    function deleteStudioNode() {
      var candidate = activeStudioCandidate();
      var node = studioNode(state.studioSelectedNodeId);
      if (!candidate || !node || !node.isDraft) return;
      pushStudioUndo();
      candidate.nodes = candidate.nodes.filter(function (item) { return item.nodeId !== node.nodeId; });
      candidate.edges = candidate.edges.filter(function (edge) { return edge.fromNodeId !== node.nodeId && edge.toNodeId !== node.nodeId; });
      appendStudioOperation("node.remove", { nodeId: node.nodeId }, cloneForStudio(node), null, true);
      state.studioSelectedNodeId = candidate.nodes[0] ? candidate.nodes[0].nodeId : null;
      validateStudioSession(); persistStudioSession(); renderStudio();
    }

      var candidate = activeStudioCandidate();
      var from = studioNode(state.studioSelectedNodeId);
      var targetSelect = document.querySelector("[data-studio-edge-target]");
      var to = targetSelect ? studioNode(targetSelect.value) : null;

        showToast("该数据流已存在"); return;

      pushStudioUndo();
      var edge = { edgeId: "DRAFT-EDGE-" + String(Date.now()), entityRef: null, fromNodeId: from.nodeId, toNodeId: to.nodeId, label: "data", dataSummary: "待补充数据契约", isDraft: true };

      state.studioSelectedEdgeId = edge.edgeId;
      appendStudioOperation("edge.add", { edgeId: edge.edgeId }, null, cloneForStudio(edge), true);
      validateStudioSession(); persistStudioSession(); renderStudio();

    function deleteStudioEdge(edgeId) {

      if (!candidate) return;
      var edge = candidate.edges.find(function (item) { return item.edgeId === edgeId && item.isDraft; });

      candidate.edges = candidate.edges.filter(function (item) { return item.edgeId !== edgeId; });

      validateStudioSession(); persistStudioSession(); renderStudio();

    function importStudioSession(file) {
      if (!file || file.size > 1024 * 1024) { showToast("草稿文件不能超过 1 MB"); return; }
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var imported = JSON.parse(String(reader.result || ""));
          if (!imported || imported.format !== "panorama-architecture-session.v0.1") throw new Error("格式不受支持");
          if (!imported.projectBinding || imported.projectBinding.projectId !== data.project.id) throw new Error("草稿不属于当前项目");
          if (!studioSessionShapeValid(imported)) throw new Error("草稿结构无效或超过原型限制");
          imported.status = imported.projectBinding.baseRevision === data.meta.revision && (imported.projectBinding.gitHead || null) === ((data.sourceBinding && data.sourceBinding.gitHead) || null) ? "dirty" : "stale";
          state.studioUndoStack.push(studioSnapshot());
          state.studioRedoStack = [];
          state.studioSession = imported;
          state.studioSession.mode = "offline";
          state.studioSession.sessionRevision = 0;
          var candidate = activeStudioCandidate();
          state.studioSelectedNodeId = candidate && candidate.nodes[0] ? candidate.nodes[0].nodeId : null;
          validateStudioSession(); persistStudioSession(); renderStudio(); showToast("已导入离线架构草稿");
        } catch (error) {
          showToast("导入失败：" + String(error.message || error));
        }
      };
      reader.onerror = function () { showToast("无法读取草稿文件"); };
      reader.readAsText(file, "utf-8");
    }

    function drawConnections() {

      var boardRect = board.getBoundingClientRect();
      var width = Math.max(1, board.clientWidth);
      var height = Math.max(1, board.scrollHeight);
      svg.setAttribute("viewBox", "0 0 " + width + " " + height);
      svg.setAttribute("height", height);
      var defs = "<defs><marker id='arrow-current' markerWidth='8' markerHeight='8' refX='7' refY='3.5' orient='auto'><path d='M0,0 L7,3.5 L0,7 z' fill='#67738f'/></marker><marker id='arrow-target' markerWidth='8' markerHeight='8' refX='7' refY='3.5' orient='auto'><path d='M0,0 L7,3.5 L0,7 z' fill='#2448d8'/></marker><marker id='arrow-deprecated' markerWidth='8' markerHeight='8' refX='7' refY='3.5' orient='auto'><path d='M0,0 L7,3.5 L0,7 z' fill='#d62f3d'/></marker></defs>";
      var content = arr(data.architecture.connections).filter(function (connection) {

        var fromNode = board.querySelector("[data-module-id='" + cssEscape(connection.fromModuleId) + "']");

        if (!fromNode || !toNode) return "";
        var fromRect = fromNode.getBoundingClientRect();
        var toRect = toNode.getBoundingClientRect();
        var x1 = fromRect.left - boardRect.left + fromRect.width / 2;
        var y1 = fromRect.bottom - boardRect.top;
        var x2 = toRect.left - boardRect.left + toRect.width / 2;
        var y2 = toRect.top - boardRect.top;
        if (y2 < y1) {
          x1 = fromRect.right - boardRect.left;
          y1 = fromRect.top - boardRect.top + fromRect.height / 2;
          x2 = toRect.left - boardRect.left;
          y2 = toRect.top - boardRect.top + toRect.height / 2;

        var midY = y1 + (y2 - y1) * .5;
        var className = "connection-path";
        var marker = "arrow-current";

    document.getElementById("drawer-backdrop").addEventListener("click", closeDrawer);
    document.addEventListener("keydown", function (event) {
      var dialog = event.target.closest && event.target.closest("dialog[open]");
      if (dialog && event.key === "Escape") { event.preventDefault(); cancelStudioDialog(dialog.id); return; }
      if (trapDrawerFocus(event)) return;
      if (event.key === "Escape") { closeDrawer(); return; }
      var candidateTab = event.target.closest && event.target.closest("[data-studio-candidate-tab]");
      if (candidateTab && ["ArrowLeft", "ArrowRight", "Home", "End"].indexOf(event.key) >= 0) {
        var candidateTabs = Array.prototype.slice.call(document.querySelectorAll("[data-studio-candidate-tab]"));
        var currentIndex = candidateTabs.indexOf(candidateTab); var nextIndex = currentIndex;
        if (event.key === "ArrowLeft") nextIndex = (currentIndex - 1 + candidateTabs.length) % candidateTabs.length;
        if (event.key === "ArrowRight") nextIndex = (currentIndex + 1) % candidateTabs.length;
        if (event.key === "Home") nextIndex = 0;
        if (event.key === "End") nextIndex = candidateTabs.length - 1;
        event.preventDefault(); selectStudioCandidate(candidateTabs[nextIndex].dataset.studioCandidateTab);
        window.setTimeout(function () { var selectedTab = document.querySelector("[data-studio-candidate-tab][aria-selected='true']"); if (selectedTab) selectedTab.focus(); }, 0); return;
      }
      var mobileTab = event.target.closest && event.target.closest("[data-studio-mobile-panel]");
      if (mobileTab && ["ArrowLeft", "ArrowRight", "Home", "End"].indexOf(event.key) >= 0) {
        var mobileTabs = Array.prototype.slice.call(document.querySelectorAll("[data-studio-mobile-panel]")); var mobileIndex = mobileTabs.indexOf(mobileTab); var targetIndex = mobileIndex;
        if (event.key === "ArrowLeft") targetIndex = (mobileIndex - 1 + mobileTabs.length) % mobileTabs.length;
        if (event.key === "ArrowRight") targetIndex = (mobileIndex + 1) % mobileTabs.length;
        if (event.key === "Home") targetIndex = 0; if (event.key === "End") targetIndex = mobileTabs.length - 1;
        event.preventDefault(); state.studioMobilePanel = mobileTabs[targetIndex].dataset.studioMobilePanel; renderStudio();
        window.setTimeout(function () { var selectedMobileTab = document.querySelector("[data-studio-mobile-panel][aria-selected='true']"); if (selectedMobileTab) selectedMobileTab.focus(); }, 0); return;
      }
      var nodeTarget = event.target.closest && event.target.closest("[data-studio-node-id]");
      if (nodeTarget && event.altKey && ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].indexOf(event.key) >= 0) {
        var step = event.shiftKey ? 40 : 10; var dx = event.key === "ArrowLeft" ? -step : (event.key === "ArrowRight" ? step : 0); var dy = event.key === "ArrowUp" ? -step : (event.key === "ArrowDown" ? step : 0);
        event.preventDefault(); moveStudioNodeWithKeyboard(nodeTarget.dataset.studioNodeId, dx, dy); return;
      }
    });
    document.addEventListener("cancel", function (event) {
      if (event.target.matches && event.target.matches("dialog.studio-dialog")) { event.preventDefault(); cancelStudioDialog(event.target.id); }
    });
    document.addEventListener("change", function (event) {
      if ((state.studioBridge.applyResult || state.studioBridge.sessionMutationBusy) && event.target.closest(".studio-shell")) { showToast(state.studioBridge.applyResult ? "Apply 后 Studio 已冻结，请重新载入当前 Panorama" : "正式事务执行中，请等待完成"); return; }
      if (event.target.dataset.studioImport !== undefined) { importStudioSession(event.target.files && event.target.files[0]); return; }
      if (event.target.dataset.studioCompareId !== undefined) {
        var compareId = event.target.dataset.studioCompareId;
        if (event.target.checked) {
          if (state.studioCompareIds.length >= 3) { event.target.checked = false; showToast("最多同时比较 3 个候选方案"); return; }
          if (state.studioCompareIds.indexOf(compareId) < 0) state.studioCompareIds.push(compareId);
        } else state.studioCompareIds = state.studioCompareIds.filter(function (id) { return id !== compareId; });
        if (state.studioCompareIds.length < 2) state.studioCompareOpen = false;
        renderStudio(); return;
      }
      if (event.target.dataset.studioField) {
        var selectedStudioNode = studioNode(state.studioSelectedNodeId);
        var beforeStudioField = state.studioFieldBaseline && state.studioFieldBaseline.nodeId === state.studioSelectedNodeId && state.studioFieldBaseline.field === event.target.dataset.studioField ? state.studioFieldBaseline.value : (selectedStudioNode ? cloneForStudio(selectedStudioNode[event.target.dataset.studioField]) : null);
        updateStudioField(event.target.dataset.studioField, event.target.value, beforeStudioField);
        state.studioFieldBaseline = null;
        return;
      }
      if (event.target.dataset.studioCandidateField) { updateStudioCandidateField(event.target.dataset.studioCandidateField, event.target.value); return; }
      if (event.target.dataset.studioEdgeField) { updateStudioEdgeField(event.target.dataset.studioEdgeField, event.target.value); return; }
      if (event.target.dataset.studioScope !== undefined) { pushStudioUndo(); var beforeScope = state.studioSession.scope.level; state.studioSession.scope.level = event.target.value; appendStudioOperation("session.change_scope", { sessionId: state.studioSession.sessionId }, beforeScope, event.target.value, true); persistStudioSession(); renderStudio(); return; }
      if (event.target.dataset.studioCandidate !== undefined) { selectStudioCandidate(event.target.value); return; }
      var filter = event.target.dataset.filter;
      if (!filter) return;
      if (filter === "layer-filter") state.layerFilter = event.target.value;
      if (filter === "source-filter") state.sourceFilter = event.target.value;
      if (filter === "status-filter") state.statusFilter = event.target.value;
      if (filter === "requirement-type") state.requirementFilters.type = event.target.value;
      if (filter === "requirement-definition") state.requirementFilters.definition = event.target.value;
      if (filter === "requirement-fulfillment") state.requirementFilters.fulfillment = event.target.value;
      if (filter === "resource-environment") state.resourcePoolFilters.environment = event.target.value;
      if (filter === "resource-type") state.resourcePoolFilters.type = event.target.value;
      if (filter === "resource-status") state.resourcePoolFilters.status = event.target.value;
      if (filter === "evidence-authority") state.evidenceAuthorityFilter = event.target.value;
      if (filter === "evidence-confidence") state.evidenceConfidenceFilter = event.target.value;
      if (filter.indexOf("requirement-") === 0) renderControl();
      else if (filter.indexOf("resource-") === 0) { state.selectedResourceId = null; renderRuntime(); }
      else if (filter.indexOf("evidence-") === 0) renderSource();
      else renderLogical();
    });
    document.addEventListener("input", function (event) {
      if (event.target.dataset.filter === "module-search") {
        state.moduleSearch = event.target.value;
        window.clearTimeout(renderLogical.searchTimer);
        renderLogical.searchTimer = window.setTimeout(renderLogical, 100);
      }
      if (event.target.dataset.filter === "evidence-search") {
        state.evidenceSearch = event.target.value;
        window.clearTimeout(renderSource.searchTimer);
        renderSource.searchTimer = window.setTimeout(renderSource, 100);
      }
    });
    document.addEventListener("focusin", function (event) {
      if (!event.target.dataset.studioField) return;
      var node = studioNode(state.studioSelectedNodeId);
      if (!node) return;
      state.studioFieldBaseline = { nodeId: node.nodeId, field: event.target.dataset.studioField, value: cloneForStudio(node[event.target.dataset.studioField]) };
    });
    document.addEventListener("focusout", function (event) {
      if (state.studioBridge.applyResult || state.studioBridge.sessionMutationBusy) return;
      if (!event.target.dataset.studioField) return;
      var selectedStudioNode = studioNode(state.studioSelectedNodeId);
      var beforeStudioField = state.studioFieldBaseline && state.studioFieldBaseline.nodeId === state.studioSelectedNodeId && state.studioFieldBaseline.field === event.target.dataset.studioField ? state.studioFieldBaseline.value : (selectedStudioNode ? cloneForStudio(selectedStudioNode[event.target.dataset.studioField]) : null);
      updateStudioField(event.target.dataset.studioField, event.target.value, beforeStudioField);
      state.studioFieldBaseline = null;
    });
    var studioDrag = null;
    document.addEventListener("pointerdown", function (event) {
      if (state.studioMode !== "studio" || state.studioBridge.applyResult || state.studioBridge.sessionMutationBusy || event.button !== 0) return;
      var target = event.target.closest("[data-studio-node-id]");
      if (!target || event.target.closest("input, textarea, select")) return;
      var node = studioNode(target.dataset.studioNodeId);
      var surface = document.getElementById("studio-canvas-surface");
      if (!node || !surface) return;
      state.studioSelectedNodeId = node.nodeId;
      studioDrag = { node: node, element: target, surface: surface, pointerId: event.pointerId, startX: event.clientX, startY: event.clientY, originalX: Number(node.x), originalY: Number(node.y), moved: false };
      target.setPointerCapture(event.pointerId);
      target.classList.add("is-dragging", "is-selected");
      event.preventDefault();
    });
    document.addEventListener("pointermove", function (event) {
      if (!studioDrag || event.pointerId !== studioDrag.pointerId) return;
      var deltaX = event.clientX - studioDrag.startX;
      var deltaY = event.clientY - studioDrag.startY;
      if (Math.abs(deltaX) + Math.abs(deltaY) > 3) studioDrag.moved = true;
      var maxX = Math.max(130, studioDrag.surface.clientWidth - 190);
      var maxY = Math.max(30, studioDrag.surface.clientHeight - 92);
      studioDrag.node.x = Math.max(125, Math.min(maxX, studioDrag.originalX + deltaX));
      studioDrag.node.y = Math.max(8, Math.min(maxY, studioDrag.originalY + deltaY));
      studioDrag.element.style.left = studioDrag.node.x + "px";
      studioDrag.element.style.top = studioDrag.node.y + "px";
      drawStudioEdges();
    });
    document.addEventListener("pointerup", function (event) {
      if (!studioDrag || event.pointerId !== studioDrag.pointerId) return;
      studioDrag.element.classList.remove("is-dragging");
      if (studioDrag.moved) {
        var before = { x: studioDrag.originalX, y: studioDrag.originalY };
        var after = { x: Math.round(studioDrag.node.x), y: Math.round(studioDrag.node.y) };
        studioDrag.node.x = after.x; studioDrag.node.y = after.y;
        state.studioUndoStack.push({ session: cloneForStudio(state.studioSession), selected: state.studioSelectedNodeId });
        var lastSnapshot = state.studioUndoStack[state.studioUndoStack.length - 1];
        var snapCandidate = lastSnapshot.session.candidates.find(function (item) { return item.candidateId === lastSnapshot.session.activeCandidateId; }) || lastSnapshot.session.candidates[0];
        var snapNode = snapCandidate && snapCandidate.nodes.find(function (item) { return item.nodeId === studioDrag.node.nodeId; });
        if (snapNode) { snapNode.x = before.x; snapNode.y = before.y; }
        state.studioRedoStack = [];
        appendStudioOperation("layout.move", { nodeId: studioDrag.node.nodeId }, before, after, false);
        persistStudioSession();
      }
      studioDrag = null;
      renderStudio();
    });
    window.addEventListener("resize", function () {
      if (state.view === "system" && state.systemView === "logical") {
        if (state.studioMode === "studio") {
          window.clearTimeout(drawStudioEdges.resizeTimer);
          drawStudioEdges.resizeTimer = window.setTimeout(drawStudioEdges, 100);
        } else {
          window.clearTimeout(drawConnections.resizeTimer);
          drawConnections.resizeTimer = window.setTimeout(drawConnections, 100);
        }
      }
    });
  }());
  </script>
</body>
</html>
