$("search").oninput=e=>{S.q=e.target.value.trim().toLowerCase();render();fitView()};$("fact-filter").onchange=e=>{S.filter=e.target.value;render();fitView()};$("trace-mode").onchange=e=>{S.trace=e.target.value;syncHash(S.selectedRelation?"relation":S.selectedEntity?"entity":null,S.selectedRelation||S.selectedEntity);render()};$("fit").onclick=fitView;$("theme").onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==="dark"?"light":"dark"};$("close-drawer").onclick=()=>$("drawer").classList.add("closed");document.addEventListener("keydown",e=>{if(e.key==="Escape")$("drawer").classList.add("closed")});
const svg=$("canvas");svg.onwheel=e=>{e.preventDefault();const old=S.scale;S.scale=Math.max(.35,Math.min(2.4,S.scale*(e.deltaY<0?1.1:.9)));const rect=svg.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;S.tx=x-(x-S.tx)*(S.scale/old);S.ty=y-(y-S.ty)*(S.scale/old);render()};svg.onpointerdown=e=>{S.drag={x:e.clientX,y:e.clientY,tx:S.tx,ty:S.ty};svg.setPointerCapture(e.pointerId);svg.classList.add("dragging")};svg.onpointermove=e=>{if(!S.drag)return;S.tx=S.drag.tx+e.clientX-S.drag.x;S.ty=S.drag.ty+e.clientY-S.drag.y;render()};svg.onpointerup=()=>{S.drag=null;svg.classList.remove("dragging")};
function rendererDiagnostics(){const nodeEls=[...document.querySelectorAll("[data-node]")],nodeRects=new Map(nodeEls.map(el=>[el.dataset.node,el.getBoundingClientRect()])),nodeOverlaps=[];for(let i=0;i<nodeEls.length;i++)for(let j=i+1;j<nodeEls.length;j++){const a=nodeRects.get(nodeEls[i].dataset.node),b=nodeRects.get(nodeEls[j].dataset.node);if(Math.min(a.right,b.right)-Math.max(a.left,b.left)>2&&Math.min(a.bottom,b.bottom)-Math.max(a.top,b.top)>2)nodeOverlaps.push([nodeEls[i].dataset.node,nodeEls[j].dataset.node])}const edgeThroughNodes=[];document.querySelectorAll("[data-edge]").forEach(group=>{const path=group.querySelector(".edge"),length=path.getTotalLength(),matrix=path.getScreenCTM();if(!matrix)return;for(let i=2;i<39;i++){const point=path.getPointAtLength(length*i/40),screen=new DOMPoint(point.x,point.y).matrixTransform(matrix);for(const [id,r] of nodeRects){if(id===group.dataset.from||id===group.dataset.to)continue;if(screen.x>r.left+3&&screen.x<r.right-3&&screen.y>r.top+3&&screen.y<r.bottom-3){edgeThroughNodes.push([group.dataset.edge,id]);i=40;break}}}});const side=$("gaps").parentElement,canvas=svg.getBoundingClientRect();return{viewSetId:viewSet.viewSetId,chapterId:S.chapter.chapterId,viewId:S.view.viewId,profile:S.view.profile,architectureScope:S.chapter.architectureScope,nodeCount:nodeEls.length,edgeCount:document.querySelectorAll("[data-edge]").length,nodeOverlaps,edgeThroughNodes,sideOverflow:side.scrollWidth>side.clientWidth+1,canvas:{width:canvas.width,height:canvas.height},scale:S.scale}}
function publishDiagnostics(){requestAnimationFrame(()=>{$("qa-diagnostics").textContent=JSON.stringify(rendererDiagnostics())})}
window.__PANORAMA_RENDERER_QA__={diagnose:rendererDiagnostics,fitView,view:()=>({viewSetId:viewSet.viewSetId,chapterId:S.chapter.chapterId,viewId:S.view.viewId,profile:S.view.profile,architectureScope:S.chapter.architectureScope,selectedEntity:S.selectedEntity,selectedRelation:S.selectedRelation,trace:S.trace,filter:S.filter})};
function fromHash(){const p=new URLSearchParams(location.hash.slice(1)),v=viewById.get(p.get("view"));if(v){S.view=v;S.chapter=chapters.find(c=>c.viewId===v.viewId)}const trace=p.get("trace");if(["neighbors","upstream","downstream","connected"].includes(trace))S.trace=trace;$("trace-mode").value=S.trace;const entity=p.get("entity"),relation=p.get("relation"),n=entity&&S.view.nodes.find(x=>x.entityRef.id===entity),edge=relation&&S.view.edges.find(x=>x.relationRef.id===relation);S.selectedEntity=entity||S.selectedEntity;S.selectedRelation=relation||null;S.selected=n?n.id:null;render();if(n)showNode(n.id);else if(edge)showEdge(edge.id);requestAnimationFrame(fitView)}window.addEventListener("hashchange",fromHash);fromHash()})();
