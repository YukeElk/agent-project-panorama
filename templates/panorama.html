<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>Agent Project Panorama</title>
  <style>
    :root {
      --page: #fff;
      --band: #f7f8fb;
      --band-strong: #f1f3f8;
      --ink: #111c3a;
      --muted: #5f687d;
      --faint: #80889a;
      --rule: #d9deea;
      --rule-strong: #b8c0d4;
      --primary: #2448d8;
      --primary-hover: #1739bd;
      --primary-tint: #eef2ff;
      --passed: #168653;
      --warning: #c7790a;
      --critical: #d62f3d;
      --info: #4169b2;
      --radius: 8px;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      --topbar-height: 58px;
    }

    * { box-sizing: border-box; }
    html { background: var(--page); color: var(--ink); font-family: var(--sans); }
    body { margin: 0; min-width: 320px; background: var(--page); font-size: 14px; line-height: 1.45; }
    button, input, select { color: inherit; font: 600 13px/1.2 var(--sans); }
    button { cursor: pointer; }
    a { color: var(--primary); text-decoration-thickness: 1px; text-underline-offset: 3px; }
    a:hover { color: var(--primary-hover); }
    code, .mono { font-family: var(--mono); font-size: .92em; }
    h1, h2, h3, h4, p { margin-top: 0; }
    h1 { font-size: 23px; letter-spacing: -.025em; line-height: 1.18; margin-bottom: 7px; }
    h2 { font-size: 17px; letter-spacing: -.015em; margin-bottom: 12px; }
    h3 { font-size: 14px; letter-spacing: -.005em; margin-bottom: 8px; }
    ul { margin: 0; padding-left: 19px; }
    li + li { margin-top: 5px; }
    [hidden] { display: none !important; }

    .skip-link {
      position: fixed; z-index: 100; top: 8px; left: 8px; transform: translateY(-160%);
      background: var(--ink); color: #fff; padding: 9px 12px; border-radius: 4px;
    }
    .skip-link:focus { transform: none; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    .topbar {
      height: var(--topbar-height); border-bottom: 1px solid var(--rule);
      display: grid; grid-template-columns: minmax(230px, 1fr) auto minmax(230px, 1fr);
      align-items: stretch; position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,.98);
    }
    .brand {
      display: flex; align-items: center; gap: 10px; padding: 0 22px;
      font-weight: 760; letter-spacing: -.01em; white-space: nowrap;
    }
    .brand-mark {
      width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid var(--ink);
      font: 700 12px/1 var(--mono); color: var(--ink);
    }
    .primary-nav { display: flex; align-items: stretch; }
    .nav-btn {
      position: relative; min-width: 112px; border: 0; background: transparent; padding: 0 20px;
      color: var(--muted); letter-spacing: .035em;
    }
    .nav-btn:hover { color: var(--ink); background: var(--band); }
    .nav-btn[aria-selected="true"] { color: var(--primary); }
    .nav-btn[aria-selected="true"]::after {
      content: ""; position: absolute; left: 20px; right: 20px; bottom: 0; height: 3px; background: var(--primary);
    }
    .topbar-meta { display: flex; align-items: center; justify-content: flex-end; padding: 0 22px; color: var(--muted); }
    .revision-label { font: 600 12px/1 var(--mono); }

    main { min-height: calc(100vh - var(--topbar-height)); }
    .view { padding: 22px clamp(20px, 2.6vw, 42px) 48px; }
    .view-head {
      display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 18px;
    }
    .eyeless-summary { color: var(--muted); max-width: 820px; margin: 0; }
    .section-rule { border-top: 1px solid var(--rule); padding-top: 18px; margin-top: 18px; }
    .section-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 11px; }
    .section-heading h2, .section-heading h3 { margin: 0; }
    .count { color: var(--muted); font: 600 12px/1 var(--mono); }
    .empty-state { border: 1px dashed var(--rule-strong); color: var(--muted); padding: 24px; text-align: center; }

    .project-strip {
      display: grid; grid-template-columns: minmax(270px, 1.55fr) repeat(5, minmax(120px, .75fr)) minmax(165px, .9fr);
      border: 1px solid var(--rule); border-radius: var(--radius); margin-bottom: 18px; overflow: hidden;
    }
    .project-identity, .meta-cell { min-width: 0; padding: 16px 17px; }
    .meta-cell { border-left: 1px solid var(--rule); }
    .project-identity p { color: var(--muted); margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .meta-label {
      display: block; color: var(--muted); font-size: 11px; font-weight: 720; letter-spacing: .05em;
      text-transform: uppercase; margin-bottom: 7px;
    }
    .meta-value { display: block; font-weight: 720; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .focus-value { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .sensitive-flag { color: var(--critical); font-size: 12px; font-weight: 700; margin-top: 8px; display: flex; gap: 6px; align-items: center; }
    .environment-mini { display: flex; flex-wrap: wrap; gap: 8px 12px; }

    .control-grid { display: grid; grid-template-columns: minmax(0, 2.05fr) minmax(285px, .95fr); gap: 18px; align-items: start; }
    .control-main, .attention-rail { min-width: 0; }
    .framed { border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; background: var(--page); }
    .reviewed-list { list-style: none; padding: 0; }
    .reviewed-item {
      display: grid; grid-template-columns: 5px minmax(0, 1fr); gap: 13px; padding: 13px 15px;
      border-bottom: 1px solid var(--rule); align-items: start;
    }
    .reviewed-item:last-child { border-bottom: 0; }
    .semantic-bar { width: 4px; height: 100%; min-height: 27px; border-radius: 2px; background: var(--primary); }
    .reviewed-item p { margin: 0; }
    .reviewed-meta { color: var(--muted); font-size: 12px; margin-top: 5px; display: flex; gap: 18px; flex-wrap: wrap; }

    .attention-item {
      border-left: 4px solid var(--warning); border-bottom: 1px solid var(--rule); padding: 14px 15px;
    }
    .attention-item:last-child { border-bottom: 0; }
    .attention-item.is-high, .attention-item.is-critical { border-left-color: var(--critical); }
    .attention-item h3 { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .attention-item p { color: var(--muted); margin: 0; }
    .attention-type { font: 600 11px/1 var(--mono); color: var(--faint); text-transform: uppercase; }

    details { border-bottom: 1px solid var(--rule); }
    details:last-child { border-bottom: 0; }
    summary {
      list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 13px 15px; cursor: pointer; font-weight: 720;
    }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: ""; width: 8px; height: 8px; border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor; transform: rotate(45deg); transition: transform .16s ease; }
    details[open] summary::after { transform: rotate(225deg); }
    .focus-option[open] { box-shadow: inset 3px 0 0 var(--primary); }
    .focus-rank {
      width: 25px; height: 25px; border: 1px solid var(--primary); color: var(--primary);
      display: inline-grid; place-items: center; border-radius: 4px; font: 700 12px/1 var(--mono); flex: 0 0 auto;
    }
    .focus-summary { flex: 1; display: flex; align-items: center; gap: 10px; }
    .recommended {
      color: var(--primary); background: var(--primary-tint); border: 1px solid #d9e0ff;
      padding: 3px 6px; border-radius: 4px; font-size: 11px; letter-spacing: .02em;
    }
    .focus-body { padding: 0 16px 16px 52px; color: var(--muted); }
    .focus-body strong { color: var(--ink); }
    .focus-body-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 22px; margin-top: 12px; }
    .focus-body-grid > div { border-top: 1px solid var(--rule); padding-top: 9px; }
    .focus-body-grid p { margin-bottom: 5px; }

    .filter-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .filter-control, .search-control {
      border: 1px solid var(--rule-strong); border-radius: 5px; background: #fff; min-height: 36px; padding: 0 11px;
    }
    .search-control { min-width: 210px; font-weight: 500; }
    .filter-control { min-width: 145px; }
    .clear-btn, .text-btn {
      border: 0; color: var(--primary); background: transparent; padding: 8px; font-weight: 700;
    }
    .clear-btn:hover, .text-btn:hover { color: var(--primary-hover); text-decoration: underline; text-underline-offset: 3px; }

    .table-wrap { overflow: auto; border: 1px solid var(--rule); border-radius: var(--radius); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left; color: var(--muted); background: var(--band); font-size: 11px; letter-spacing: .035em;
      text-transform: uppercase; padding: 10px 12px; border-bottom: 1px solid var(--rule-strong); white-space: nowrap;
    }
    td { padding: 10px 12px; border-bottom: 1px solid var(--rule); vertical-align: top; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #fafbff; }
    .selected-row { background: var(--primary-tint) !important; box-shadow: inset 3px 0 0 var(--primary); }
    .cell-title { font-weight: 720; }
    .cell-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .nowrap { white-space: nowrap; }

    .status { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; font-weight: 650; white-space: nowrap; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: 0 0 auto; }
    .tone-passed .status-dot { background: var(--passed); }
    .tone-warning .status-dot { background: var(--warning); }
    .tone-critical .status-dot { background: var(--critical); }
    .tone-info .status-dot { background: var(--primary); }
    .tone-muted .status-dot { background: var(--faint); }
    .severity-text { color: var(--critical); font-weight: 720; }

    .system-shell { padding-top: 0; }
    .subnav {
      display: flex; align-items: stretch; gap: 28px; border-bottom: 1px solid var(--rule); padding: 0 clamp(20px,2.6vw,42px);
      position: sticky; top: var(--topbar-height); background: rgba(255,255,255,.98); z-index: 35;
    }
    .subnav-btn {
      position: relative; border: 0; background: transparent; padding: 16px 0 14px; color: var(--muted);
    }
    .subnav-btn[aria-selected="true"] { color: var(--primary); }
    .subnav-btn[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: var(--primary); }
    .system-content { padding: 18px clamp(20px, 2.6vw, 42px) 48px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
    .segmented { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 5px; overflow: hidden; background: #fff; }
    .segment {
      border: 0; border-right: 1px solid var(--rule); background: #fff; min-height: 35px; min-width: 96px; padding: 0 13px;
      color: var(--muted); font-size: 12px; letter-spacing: .035em;
    }
    .segment:last-child { border-right: 0; }
    .segment[aria-pressed="true"] { color: var(--primary); background: var(--primary-tint); box-shadow: inset 0 0 0 1px var(--primary); }

    .architecture-board {
      border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; position: relative; min-height: 590px; background: #fff;
    }
    .connection-svg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; overflow: visible; }
    .connection-path { fill: none; stroke: #67738f; stroke-width: 1.5; opacity: .72; }
    .connection-path.is-target { stroke: var(--primary); stroke-dasharray: 6 5; }
    .connection-path.is-deprecated { stroke: var(--critical); stroke-dasharray: 5 5; }
    .connection-label { fill: var(--muted); font: 600 10px var(--mono); paint-order: stroke; stroke: white; stroke-width: 4px; stroke-linejoin: round; }
    .arch-lane { min-height: 112px; display: grid; grid-template-columns: 135px minmax(0,1fr); border-bottom: 1px dashed var(--rule); position: relative; z-index: 2; }
    .arch-lane:last-child { border-bottom: 0; }
    .lane-title { border-right: 1px solid var(--rule); padding: 16px 14px; background: rgba(247,248,251,.82); }
    .lane-title strong { display: block; margin-bottom: 3px; }
    .lane-title span { color: var(--primary); font: 600 11px/1 var(--mono); }
    .lane-modules { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 24px 42px; padding: 15px 28px; }
    .module-node {
      width: min(225px, 100%); border: 1px solid var(--primary); background: #fff; padding: 11px 12px; border-radius: 5px;
      text-align: left; position: relative; z-index: 3; box-shadow: 0 1px 0 rgba(17,28,58,.04);
    }
    .module-node:hover, .module-node.is-selected { background: var(--primary-tint); box-shadow: inset 0 0 0 1px var(--primary); }
    .module-node.is-related { border-color: var(--ink); box-shadow: 0 0 0 2px rgba(36,72,216,.16); }
    .module-node.is-deprecating { border-color: var(--critical); border-style: dashed; }
    .module-node.is-adding { border-color: var(--primary); border-style: dashed; }
    .module-head { display: flex; align-items: start; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
    .module-name { font-weight: 760; line-height: 1.24; }
    .source-tag { color: var(--muted); font: 700 10px/1 var(--mono); text-transform: uppercase; }
    .module-flags { display: flex; gap: 5px; align-items: center; }
    .flag {
      min-width: 18px; height: 18px; padding: 0 4px; display: inline-grid; place-items: center; border: 1px solid currentColor;
      border-radius: 3px; font: 700 9px/1 var(--mono); color: var(--warning);
    }
    .flag-risk { color: var(--critical); }
    .module-status-grid { border-top: 1px solid var(--rule); padding-top: 6px; display: grid; gap: 3px; }
    .module-status-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 10px; }
    .module-transition-note { color: var(--primary); margin-top: 7px; font-size: 10px; font-style: italic; }
    .is-deprecating .module-transition-note { color: var(--critical); }

    .drawer-backdrop { position: fixed; inset: 0; background: rgba(17,28,58,.14); z-index: 70; opacity: 0; pointer-events: none; transition: opacity .18s ease; }
    .drawer-backdrop.is-open { opacity: 1; pointer-events: auto; }
    .module-drawer {
      position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 44vw); min-width: 410px; z-index: 80;
      background: #fff; border-left: 1px solid var(--rule-strong); transform: translateX(102%); transition: transform .2s ease;
      display: flex; flex-direction: column; box-shadow: -8px 0 24px rgba(17,28,58,.08);
    }
    .module-drawer[aria-hidden="true"] { visibility: hidden; }
    .module-drawer.is-open { transform: none; }
    .module-drawer.is-open[aria-hidden="false"] { visibility: visible; }
    .drawer-head { display: flex; align-items: start; justify-content: space-between; gap: 16px; padding: 18px 20px; border-bottom: 1px solid var(--rule); }
    .drawer-head h2 { font-size: 19px; margin: 0 0 4px; }
    .drawer-head p { margin: 0; color: var(--muted); }
    .icon-btn { border: 1px solid var(--rule); background: #fff; border-radius: 4px; width: 34px; height: 34px; display: grid; place-items: center; }
    .icon-btn:hover { border-color: var(--ink); background: var(--band); }
    .icon-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; }
    .drawer-body { overflow: auto; flex: 1; }
    .drawer-section { border-bottom: 1px solid var(--rule); padding: 15px 20px; }
    .drawer-section h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .045em; color: var(--muted); margin-bottom: 9px; }
    .drawer-section p:last-child { margin-bottom: 0; }
    .drawer-two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .design-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--rule); border: 1px solid var(--rule); }
    .design-column { background: #fff; padding: 12px; }
    .design-column h4 { font-size: 11px; color: var(--primary); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
    .key-value { display: grid; grid-template-columns: minmax(90px,.7fr) 1.3fr; gap: 7px 14px; }
    .key-value dt { color: var(--muted); }
    .key-value dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
    .entity-links { display: flex; flex-wrap: wrap; gap: 6px 12px; }
    .entity-link { color: var(--primary); font: 650 12px/1.4 var(--mono); }
    .copy-row { display: flex; align-items: center; gap: 8px; }
    .copy-value { flex: 1; background: var(--band); border: 1px solid var(--rule); border-radius: 4px; padding: 8px; overflow: auto; white-space: nowrap; }

    .security-notice {
      border-left: 4px solid var(--warning); background: #fffaf1; color: #6c4810; padding: 11px 14px; margin-bottom: 14px;
      display: flex; align-items: center; gap: 9px; font-weight: 650;
    }
    .runtime-header {
      display: flex; align-items: center; justify-content: space-between; gap: 18px; border: 1px solid var(--rule);
      padding: 13px 15px; border-radius: var(--radius); margin-bottom: 14px;
    }
    .runtime-header-meta { display: flex; flex-wrap: wrap; gap: 12px 22px; color: var(--muted); }
    .runtime-flow { color: var(--ink); font-weight: 760; padding: 11px 13px; border-bottom: 1px solid var(--rule); }
    .runtime-flow span { color: var(--primary); padding: 0 8px; }
    .runtime-grid { display: grid; grid-template-columns: minmax(0,1.05fr) minmax(350px,.95fr); gap: 14px; align-items: start; }
    .clickable-row { cursor: pointer; }
    .resource-inspector { margin-top: 14px; border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; }
    .inspector-head { padding: 13px 16px; border-bottom: 1px solid var(--rule); display: flex; align-items: center; justify-content: space-between; }
    .inspector-head h2 { margin: 0; }
    .inspector-grid { display: grid; grid-template-columns: .8fr 1.1fr 1.2fr; }
    .inspector-pane { padding: 16px; border-right: 1px solid var(--rule); min-width: 0; }
    .inspector-pane:last-child { border-right: 0; }
    .credential-block { border: 1px solid var(--rule); }
    .credential-block + .credential-block { margin-top: 10px; }
    .credential-title { padding: 8px 10px; background: var(--band); font-size: 12px; font-weight: 760; border-bottom: 1px solid var(--rule); }
    .credential-row { display: grid; grid-template-columns: 100px minmax(0,1fr) auto; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--rule); }
    .credential-row:last-child { border-bottom: 0; }
    .credential-label { color: var(--muted); font-size: 12px; }
    .credential-value { min-width: 0; overflow-wrap: anywhere; font-family: var(--mono); font-size: 12px; }
    .small-btn { min-height: 30px; border: 1px solid var(--rule-strong); border-radius: 4px; background: #fff; padding: 0 9px; font-size: 11px; }
    .small-btn:hover { border-color: var(--primary); color: var(--primary); }

    .source-baseline { border: 1px solid var(--rule); border-radius: var(--radius); overflow: hidden; }
    .source-baseline + .source-baseline { margin-top: 14px; }
    .baseline-head { padding: 15px 16px; display: grid; grid-template-columns: 1.2fr .7fr 1.1fr; gap: 20px; border-bottom: 1px solid var(--rule); }
    .source-groups { display: grid; grid-template-columns: repeat(4,1fr); }
    .source-group { padding: 14px; border-right: 1px solid var(--rule); min-width: 0; }
    .source-group:last-child { border-right: 0; }
    .source-group h3 { text-transform: capitalize; }
    .source-module { padding: 9px 0; border-top: 1px solid var(--rule); }
    .source-module:first-of-type { border-top: 0; }
    .source-module p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }

    .timeline { position: relative; display: grid; grid-template-columns: repeat(var(--timeline-columns,4), minmax(190px,1fr)); gap: 20px; padding-top: 24px; }
    .timeline::before { content: ""; position: absolute; left: 4%; right: 4%; top: 9px; height: 1px; background: var(--ink); }
    .timeline-item { position: relative; padding: 15px 14px; border: 1px solid transparent; min-width: 0; }
    .timeline-item::before {
      content: ""; position: absolute; top: -21px; left: 14px; width: 10px; height: 10px; border-radius: 50%;
      background: #fff; border: 2px solid var(--ink);
    }
    .timeline-item.is-selected { border-color: var(--primary); background: #fafbff; }
    .timeline-item.is-selected::before { border-color: var(--primary); box-shadow: 0 0 0 3px #dce3ff; }
    .timeline-btn { display: block; width: 100%; border: 0; background: transparent; text-align: left; padding: 0; }
    .version-title { font-size: 15px; font-weight: 800; display: flex; align-items: baseline; gap: 8px; margin-bottom: 7px; }
    .timeline-date { position: absolute; top: -40px; left: 14px; color: var(--muted); font: 600 11px/1 var(--mono); }
    .delta-line { border-top: 1px solid var(--rule); margin-top: 10px; padding-top: 8px; display: flex; flex-wrap: wrap; gap: 10px; color: var(--muted); font-size: 11px; }
    .delta-add { color: var(--passed); } .delta-remove { color: var(--critical); } .delta-mod { color: var(--primary); }

    .stage-rail { display: grid; grid-template-columns: repeat(var(--stage-columns,6), minmax(145px,1fr)); border: 1px solid var(--rule-strong); overflow: auto; }
    .stage-btn { border: 0; border-right: 1px solid var(--rule); background: #fff; padding: 12px 14px; text-align: left; min-width: 145px; }
    .stage-btn:last-child { border-right: 0; }
    .stage-btn:hover { background: var(--band); }
    .stage-btn.is-selected { background: var(--primary-tint); box-shadow: inset 0 -3px 0 var(--primary); color: var(--primary); }
    .stage-index { width: 24px; height: 24px; display: inline-grid; place-items: center; border: 1px solid currentColor; border-radius: 50%; margin-right: 6px; font: 700 11px/1 var(--mono); }
    .stage-status { display: block; color: var(--muted); margin: 6px 0 0 34px; font-size: 11px; }
    .stage-detail { display: grid; grid-template-columns: .85fr 1.25fr 1.15fr 1fr .8fr; border: 1px solid var(--primary); border-top: 0; }
    .stage-detail > div { padding: 14px; border-right: 1px solid var(--rule); min-width: 0; }
    .stage-detail > div:last-child { border-right: 0; }
    .stage-detail h3 { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
    .stage-detail p, .stage-detail ul { margin-bottom: 0; font-size: 12px; }

    .toast {
      position: fixed; z-index: 120; bottom: 24px; left: 50%; transform: translate(-50%, 20px); opacity: 0;
      border: 1px solid var(--rule-strong); background: #fff; padding: 11px 15px; border-radius: 5px;
      box-shadow: 0 8px 24px rgba(17,28,58,.12); transition: opacity .16s ease, transform .16s ease; pointer-events: none;
    }
    .toast.is-visible { opacity: 1; transform: translate(-50%,0); }
    .error-banner { margin: 24px; padding: 18px; border: 1px solid var(--critical); color: #8f1f2b; background: #fff7f8; }

    @media (max-width: 1180px) {
      .topbar { grid-template-columns: auto 1fr auto; }
      .brand span:last-child { display: none; }
      .project-strip { grid-template-columns: 1.4fr repeat(3,1fr); }
      .project-strip .project-identity { grid-column: span 2; }
      .project-strip .meta-cell:nth-child(n+5) { border-top: 1px solid var(--rule); }
      .control-grid { grid-template-columns: 1fr; }
      .attention-rail { order: -1; }
      .runtime-grid { grid-template-columns: 1fr; }
      .inspector-grid { grid-template-columns: 1fr 1fr; }
      .inspector-pane:last-child { grid-column: 1 / -1; border-top: 1px solid var(--rule); }
      .source-groups { grid-template-columns: 1fr 1fr; }
      .source-group:nth-child(2) { border-right: 0; }
      .source-group:nth-child(n+3) { border-top: 1px solid var(--rule); }
      .timeline { overflow: auto; }
      .stage-detail { grid-template-columns: 1fr 1fr 1fr; }
      .stage-detail > div:nth-child(n+4) { border-top: 1px solid var(--rule); }
    }
    @media (max-width: 840px) {
      .topbar { grid-template-columns: 48px 1fr auto; }
      .brand { padding: 0 10px; }
      .nav-btn { min-width: 86px; padding: 0 10px; font-size: 11px; }
      .topbar-meta { padding: 0 10px; }
      .project-strip { grid-template-columns: 1fr 1fr; }
      .project-strip .project-identity { grid-column: 1 / -1; }
      .meta-cell { border-top: 1px solid var(--rule); }
      .focus-body-grid, .drawer-two-col, .design-compare { grid-template-columns: 1fr; }
      .module-drawer { width: min(92vw,560px); min-width: 0; }
      .toolbar { align-items: flex-start; flex-direction: column; }
      .arch-lane { grid-template-columns: 95px minmax(0,1fr); }
      .lane-modules { padding: 12px; }
      .inspector-grid { grid-template-columns: 1fr; }
      .inspector-pane { border-right: 0; border-bottom: 1px solid var(--rule); }
      .inspector-pane:last-child { grid-column: auto; }
      .baseline-head, .source-groups, .stage-detail { grid-template-columns: 1fr; }
      .source-group { border-right: 0; border-top: 1px solid var(--rule); }
      .stage-detail > div { border-right: 0; border-top: 1px solid var(--rule); }
      .timeline { grid-template-columns: repeat(var(--timeline-columns,4), minmax(230px,1fr)); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
    @media print {
      .topbar, .subnav, .toolbar, .drawer-backdrop, .module-drawer, .toast, button { display: none !important; }
      .view, .system-content { padding: 0; }
      .table-wrap, .architecture-board { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">AP</span><span>Agent Project Panorama</span></div>
    <nav class="primary-nav" aria-label="主视图">
      <button class="nav-btn" type="button" data-view="control" aria-selected="true">CONTROL</button>
      <button class="nav-btn" type="button" data-view="system" aria-selected="false">SYSTEM</button>
      <button class="nav-btn" type="button" data-view="evolution" aria-selected="false">EVOLUTION</button>
    </nav>
    <div class="topbar-meta"><span class="revision-label" id="revision-label">REV —</span></div>
  </header>

  <main id="main-content">
    <section class="view" id="view-control" data-view-panel="control"></section>
    <section class="system-shell" id="view-system" data-view-panel="system" hidden>
      <nav class="subnav" aria-label="系统子视图">
        <button class="subnav-btn" type="button" data-system-view="logical" aria-selected="true">Logical Architecture</button>
        <button class="subnav-btn" type="button" data-system-view="runtime" aria-selected="false">Runtime &amp; Resources</button>
        <button class="subnav-btn" type="button" data-system-view="source" aria-selected="false">Architecture Source</button>
      </nav>
      <div class="system-content" id="system-content"></div>
    </section>
    <section class="view" id="view-evolution" data-view-panel="evolution" hidden></section>
  </main>

  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="module-drawer" id="module-drawer" role="dialog" aria-modal="true" aria-label="Module details" aria-hidden="true">
    <div class="drawer-head">
      <div><h2 id="drawer-title">Module</h2><p class="mono" id="drawer-subtitle"></p></div>
      <button class="icon-btn" type="button" data-action="close-drawer" aria-label="关闭 Module Drawer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- PANORAMA_DATA_START -->
  <script id="project-panorama-data" type="application/json">
{}
  </script>
  <!-- PANORAMA_DATA_END -->

  <script>
  (function () {
    "use strict";

    var rootDataElement = document.getElementById("project-panorama-data");
    var data;
    try {
      data = JSON.parse(rootDataElement.textContent);
    } catch (error) {
      document.getElementById("main-content").innerHTML = "<div class='error-banner'><strong>Panorama JSON 无法读取。</strong><br>" + escapeHtml(String(error.message || error)) + "</div>";
      return;
    }
    if (!data || !data.project || !data.architecture) {
      document.getElementById("main-content").innerHTML = "<div class='empty-state' style='margin:24px'>模板尚未嵌入 Panorama 数据。请使用 scripts/init_panorama.py 生成项目 HTML。</div>";
      return;
    }

    var state = {
      view: "control",
      systemView: "logical",
      architectureMode: "current",
      moduleSearch: "",
      layerFilter: "all",
      sourceFilter: "all",
      statusFilter: "all",
      selectedModuleId: null,
      selectedStageId: data.project.currentStageId,
      selectedVersionId: data.architecture.currentVersionId,
      selectedEnvironment: preferredEnvironment(),
      selectedResourceId: null,
      revealedSecrets: {},
      attentionExpanded: false,
      requirementFilters: { type: "all", definition: "all", fulfillment: "all" }
    };

    var entityCollections = {
      requirement: data.requirements || [],
      architecture_version: data.architecture.versions || [],
      baseline: data.architecture.baselines || [],
      layer: data.architecture.layers || [],
      module: data.architecture.modules || [],
      connection: data.architecture.connections || [],
      transition: data.architecture.transitions || [],
      stage: data.stages || [],
      work_item: data.workItems || [],
      release: data.releases || [],
      deployment: data.deployments || [],
      resource: data.resources || [],
      decision: data.decisions || [],
      risk: data.risks || [],
      acceptance: data.acceptanceCriteria || [],
      gate: data.gates || [],
      reference: data.references || [],
      review: data.reviews || [],
      change: data.changes || [],
      update_batch: data.updateBatches || []
    };

    document.getElementById("revision-label").textContent = "REV " + String(data.meta.revision) + " · " + String(data.schemaVersion);
    renderAll();

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function e(value) { return escapeHtml(value); }
    function arr(value) { return Array.isArray(value) ? value : []; }
    function byId(type, id) {
      if (type === "project") return data.project && data.project.id === id ? data.project : null;
      if (type === "intent") return id === data.project.id ? data.intent : null;
      return arr(entityCollections[type]).find(function (item) { return item.id === id; }) || null;
    }
    function humanize(value) {
      return String(value == null ? "unknown" : value).replace(/_/g, " ").replace(/\b\w/g, function (m) { return m.toUpperCase(); });
    }
    function shortDate(value) {
      if (!value) return "—";
      var parsed = new Date(value);
      if (Number.isNaN(parsed.getTime())) return e(value);
      return new Intl.DateTimeFormat("zh-CN", { year: "numeric", month: "2-digit", day: "2-digit" }).format(parsed);
    }
    function dateTime(value) {
      if (!value) return "—";
      var parsed = new Date(value);
      if (Number.isNaN(parsed.getTime())) return e(value);
      return new Intl.DateTimeFormat("zh-CN", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }).format(parsed);
    }
    function toneFor(value) {
      var passed = ["passed", "stable", "confirmed", "accepted", "approved", "active", "production", "completed", "deployed", "delivered", "verified"];
      var critical = ["failed", "blocked", "critical", "degraded", "rejected", "rework"];
      var warning = ["pending", "partial", "review_pending", "review_ready", "high", "medium", "running", "not_configured", "migrating", "in_progress", "deprecating"];
      var info = ["functional", "development", "test", "staging", "prototype", "planned", "ready", "current", "proposed"];
      if (passed.indexOf(value) >= 0) return "passed";
      if (critical.indexOf(value) >= 0) return "critical";
      if (warning.indexOf(value) >= 0) return "warning";
      if (info.indexOf(value) >= 0) return "info";
      return "muted";
    }
    function status(value, label) {
      return "<span class='status tone-" + toneFor(value) + "'><span class='status-dot'></span>" + e(label || humanize(value)) + "</span>";
    }
    function list(items, emptyText) {
      if (!arr(items).length) return "<p class='cell-sub'>" + e(emptyText || "None") + "</p>";
      return "<ul>" + items.map(function (item) { return "<li>" + e(item) + "</li>"; }).join("") + "</ul>";
    }
    function entityName(type, id) {
      var item = byId(type, id);
      return item ? (item.name || item.title || item.label || item.version || item.id) : id;
    }
    function entityLinks(type, ids) {
      if (!arr(ids).length) return "<span class='cell-sub'>None</span>";
      return "<div class='entity-links'>" + ids.map(function (id) {
        return "<span class='entity-link' title='" + e(id) + "'>" + e(entityName(type, id)) + "</span>";
      }).join("") + "</div>";
    }
    function pendingReview(module) {
      return arr(module.reviewIds).some(function (id) {
        var review = byId("review", id);
        return review && review.status === "pending";
      });
    }
    function moduleGap(module) {
      var implementation = module.status.implementationMaturity;
      var verification = module.status.verificationStatus;
      return ["functional", "stable"].indexOf(implementation) >= 0 && ["passed", "waived"].indexOf(verification) < 0;
    }
    function containsEmbeddedSecret() {
      return arr(data.resources).some(function (resource) {
        return resource.access && resource.access.credentials && resource.access.credentials.mode === "embedded";
      });
    }
    function preferredEnvironment() {
      var active = arr(data.deployments).find(function (deployment) { return deployment.status === "active"; });
      return active ? active.environment : (arr(data.deployments)[0] ? data.deployments[0].environment : "development");
    }
    function currentUpdate() {
      return byId("update_batch", data.meta.latestUpdateBatchId) || arr(data.updateBatches).slice(-1)[0] || null;
    }
    function selectedDeployment() {
      return arr(data.deployments).find(function (deployment) { return deployment.environment === state.selectedEnvironment; }) || null;
    }
    function resourceForId(id) { return byId("resource", id); }
    function deploymentForModule(moduleId) {
      return arr(data.deployments).filter(function (deployment) {
        return arr(deployment.moduleDeployments).some(function (item) { return item.moduleId === moduleId; });
      });
    }

    function renderAll() {
      renderControl();
      renderSystem();
      renderEvolution();
      updateVisibleView();
    }

    function updateVisibleView() {
      document.querySelectorAll("[data-view-panel]").forEach(function (panel) {
        panel.hidden = panel.getAttribute("data-view-panel") !== state.view;
      });
      document.querySelectorAll("[data-view]").forEach(function (button) {
        button.setAttribute("aria-selected", button.getAttribute("data-view") === state.view ? "true" : "false");
      });
    }

    function renderControl() {
      var targetArch = byId("architecture_version", data.architecture.targetVersionId);
      var currentArch = byId("architecture_version", data.architecture.currentVersionId);
      var currentStage = byId("stage", data.project.currentStageId);
      var currentRelease = byId("release", data.project.currentReleaseId);
      var update = currentUpdate();
      var environmentHtml = ["development", "staging", "production"].map(function (environment) {
        var deployment = arr(data.deployments).find(function (item) { return item.environment === environment; });
        return status(deployment ? deployment.status : "unknown", environment === "development" ? "Dev" : humanize(environment));
      }).join("");
      var summaryItems = update ? arr(update.summaryItems).slice(0, 6) : [];
      var updateHtml = summaryItems.length ? summaryItems.map(function (item, index) {
        var barTone = index === 0 ? "var(--primary)" : (index === 1 ? "var(--warning)" : "var(--info)");
        return "<li class='reviewed-item'><span class='semantic-bar' style='background:" + barTone + "'></span><div><p>" + e(item) + "</p>" +
          "<div class='reviewed-meta'><span class='mono'>" + e(update.id) + "</span><span>Stage " + e(entityName("stage", update.projectStageBefore)) + " → " + e(entityName("stage", update.projectStageAfter)) + "</span><span>" + status(update.changeLevel, humanize(update.changeLevel)) + "</span></div></div></li>";
      }).join("") : "<li class='empty-state'>No reviewed update.</li>";
      var attention = update ? arr(update.attentionItems) : [];
      var shownAttention = state.attentionExpanded ? attention : attention.slice(0, 5);
      var attentionHtml = shownAttention.length ? shownAttention.map(function (item) {
        return "<article class='attention-item is-" + e(item.severity) + "'><h3><span>" + e(item.title) + "</span><span class='attention-type'>" + e(item.type) + "</span></h3><p>" + e(item.summary) + "</p></article>";
      }).join("") : "<div class='empty-state'>No current attention item.</div>";
      var options = arr(data.guidance && data.guidance.options);
      var recommendedId = data.guidance ? data.guidance.recommendedOptionId : null;
      var focusHtml = options.map(function (option, index) {
        var isRecommended = option.id === recommendedId;
        return "<details class='focus-option' " + (isRecommended ? "open" : "") + "><summary><span class='focus-rank'>" + (index + 1) + "</span><span class='focus-summary'><span>" + e(option.title) + "</span>" + (isRecommended ? "<span class='recommended'>Recommended</span>" : "") + "</span></summary>" +
          "<div class='focus-body'><p><strong>Why now — </strong>" + e(option.whyNow) + "</p><p><strong>Recommendation — </strong>" + e(option.recommendationReason) + "</p>" +
          "<div class='focus-body-grid'><div><strong>Benefits</strong>" + list(option.benefits) + "</div><div><strong>Risks</strong>" + list(option.risks) + "</div><div><strong>Impact</strong><p>" + e(option.impact) + "</p></div><div><strong>Prerequisites</strong>" + list(option.prerequisites) + "</div></div>" +
          "<p style='margin-top:12px'><strong>Expected outcome — </strong>" + e(option.expectedOutcome) + "</p></div></details>";
      }).join("");

      document.getElementById("view-control").innerHTML =
        "<div class='project-strip'><div class='project-identity'><h1>" + e(data.project.name) + "</h1><p>" + e(data.project.summary) + "</p></div>" +
        metaCell("Current Stage", currentStage ? currentStage.name : "Unknown") +
        metaCell("Current Focus", data.intent.currentFocus, "focus-value") +
        metaCell("Current Architecture", currentArch ? currentArch.label : "Unknown") +
        metaCell("Target Architecture", targetArch ? targetArch.label : "None") +
        metaCell("Current Release", currentRelease ? currentRelease.version : "None") +
        "<div class='meta-cell'><span class='meta-label'>Runtime / Updated</span><div class='environment-mini'>" + environmentHtml + "</div><div class='cell-sub' style='margin-top:7px'>" + e(dateTime(data.meta.updatedAt)) + "</div>" +
        (containsEmbeddedSecret() ? "<div class='sensitive-flag'><span aria-hidden='true'>△</span> Contains Sensitive Data</div>" : "") + "</div></div>" +
        "<div class='control-grid'><div class='control-main'>" +
        sectionHeading("Latest Reviewed Update", update ? update.id : "—") + "<div class='framed'><ul class='reviewed-list'>" + updateHtml + "</ul></div>" +
        "<div class='section-rule'>" + sectionHeading("Next Focus", options.length + " options") + "<div class='framed'>" + (focusHtml || "<div class='empty-state'>No guidance.</div>") + "</div></div>" +
        "<div class='section-rule'>" + requirementSnapshot() + "</div></div>" +
        "<aside class='attention-rail'>" + sectionHeading("Attention", attention.length) + "<div class='framed'>" + attentionHtml +
        (attention.length > 5 ? "<button class='text-btn' type='button' data-action='toggle-attention'>" + (state.attentionExpanded ? "Show top 5" : "View all") + "</button>" : "") + "</div></aside></div>";
    }

    function metaCell(label, value, extraClass) {
      return "<div class='meta-cell'><span class='meta-label'>" + e(label) + "</span><span class='meta-value " + e(extraClass || "") + "'>" + e(value || "Unknown") + "</span></div>";
    }
    function sectionHeading(title, countValue) {
      return "<div class='section-heading'><h2>" + e(title) + "</h2><span class='count'>" + e(countValue) + "</span></div>";
    }
    function optionsFor(values) {
      return ["all"].concat(Array.from(new Set(values.filter(Boolean)))).map(function (value) {
        return "<option value='" + e(value) + "'>" + (value === "all" ? "All" : e(humanize(value))) + "</option>";
      }).join("");
    }
    function requirementSnapshot() {
      var requirements = arr(data.requirements).filter(function (requirement) {
        return (state.requirementFilters.type === "all" || requirement.type === state.requirementFilters.type) &&
          (state.requirementFilters.definition === "all" || requirement.definitionStatus === state.requirementFilters.definition) &&
          (state.requirementFilters.fulfillment === "all" || requirement.fulfillmentStatus === state.requirementFilters.fulfillment);
      });
      var rows = requirements.map(function (requirement) {
        return "<tr><td><span class='mono'>" + e(requirement.id) + "</span><div class='cell-sub'>" + e(requirement.title) + "</div></td><td>" + e(humanize(requirement.type)) + "</td><td>" + status(requirement.definitionStatus) + "</td><td>" + status(requirement.fulfillmentStatus) + "</td><td>" +
          arr(requirement.targetReleaseIds).map(function (id) { return "<span class='mono'>" + e(entityName("release", id)) + "</span>"; }).join(", ") +
          "</td><td>" + (requirement.moduleIds.length ? e(requirement.moduleIds.length + " · " + requirement.moduleIds.map(function (id) { return entityName("module", id); }).join(", ")) : "<span class='severity-text'>Uncovered</span>") + "</td></tr>";
      }).join("");
      return "<div class='section-heading'><h2>Requirement Snapshot</h2><div class='filter-row'>" +
        selectControl("requirement-type", optionsFor(arr(data.requirements).map(function (r) { return r.type; })), state.requirementFilters.type, "Type") +
        selectControl("requirement-definition", optionsFor(arr(data.requirements).map(function (r) { return r.definitionStatus; })), state.requirementFilters.definition, "Definition") +
        selectControl("requirement-fulfillment", optionsFor(arr(data.requirements).map(function (r) { return r.fulfillmentStatus; })), state.requirementFilters.fulfillment, "Fulfillment") +
        "</div></div><div class='table-wrap'><table><thead><tr><th>ID / Requirement</th><th>Type</th><th>Definition</th><th>Fulfillment</th><th>Target Release</th><th>Module Coverage</th></tr></thead><tbody>" + (rows || "<tr><td colspan='6'>No matching requirement.</td></tr>") + "</tbody></table></div>";
    }
    function selectControl(action, options, value, label) {
      return "<label><span class='meta-label' style='position:absolute;clip:rect(0 0 0 0)'>" + e(label) + "</span><select class='filter-control' data-filter='" + e(action) + "'>" +
        options.replace("value='" + e(value) + "'", "value='" + e(value) + "' selected") + "</select></label>";
    }

    function renderSystem() {
      document.querySelectorAll("[data-system-view]").forEach(function (button) {
        button.setAttribute("aria-selected", button.getAttribute("data-system-view") === state.systemView ? "true" : "false");
      });
      if (state.systemView === "logical") renderLogical();
      if (state.systemView === "runtime") renderRuntime();
      if (state.systemView === "source") renderSource();
    }

    function renderLogical() {
      var layers = arr(data.architecture.layers).slice().sort(function (a,b) { return a.order - b.order; });
      var visibleModules = logicalModules();
      var laneHtml = layers.map(function (layer) {
        var modules = visibleModules.filter(function (module) {
          var effectiveLayer = state.architectureMode === "target" && module.targetLayerId ? module.targetLayerId : module.layerId;
          return effectiveLayer === layer.id;
        });
        if (state.layerFilter !== "all" && state.layerFilter !== layer.id) return "";
        return "<section class='arch-lane' data-layer-id='" + e(layer.id) + "'><div class='lane-title'><strong>" + e(layer.name) + "</strong><span>" + e(layer.id) + "</span></div><div class='lane-modules'>" +
          (modules.length ? modules.map(moduleNode).join("") : "<span class='cell-sub'>No visible module</span>") + "</div></section>";
      }).join("");
      document.getElementById("system-content").innerHTML =
        "<div class='toolbar'><div class='filter-row'><input class='search-control' type='search' data-filter='module-search' value='" + e(state.moduleSearch) + "' placeholder='Search ID / name' aria-label='Search ID or module name'>" +
        selectControl("layer-filter", optionsFor(layers.map(function (layer) { return layer.id; })), state.layerFilter, "Layer") +
        selectControl("source-filter", optionsFor(arr(data.architecture.modules).map(function (module) { return module.source.changeType; })), state.sourceFilter, "Source") +
        selectControl("status-filter", "<option value='all'>All Status</option><option value='review'>Pending Review</option><option value='risk'>Has Risk</option><option value='gap'>Verification Gap</option><option value='passed'>Verified</option>", state.statusFilter, "Status") +
        "<button class='clear-btn' type='button' data-action='clear-module-filters'>Clear</button></div>" +
        "<div class='segmented' aria-label='Architecture mode'>" + ["current","target","transition"].map(function (mode) {
          return "<button class='segment' type='button' data-architecture-mode='" + mode + "' aria-pressed='" + (state.architectureMode === mode) + "'>" + mode.toUpperCase() + "</button>";
        }).join("") + "</div></div>" +

    function drawConnections() {
      var board = document.getElementById("architecture-board");
      var svg = document.getElementById("connection-svg");
      if (!board || !svg) return;
      var nodes = Array.from(board.querySelectorAll("[data-module-id]"));
      var visibleIds = new Set(nodes.map(function (node) { return node.getAttribute("data-module-id"); }));
      var boardRect = board.getBoundingClientRect();
      var width = Math.max(1, board.clientWidth);
      var height = Math.max(1, board.scrollHeight);
      svg.setAttribute("viewBox", "0 0 " + width + " " + height);
      svg.setAttribute("height", height);
      var defs = "<defs><marker id='arrow-current' markerWidth='8' markerHeight='8' refX='7' refY='3.5' orient='auto'><path d='M0,0 L7,3.5 L0,7 z' fill='#67738f'/></marker><marker id='arrow-target' markerWidth='8' markerHeight='8' refX='7' refY='3.5' orient='auto'><path d='M0,0 L7,3.5 L0,7 z' fill='#2448d8'/></marker><marker id='arrow-deprecated' markerWidth='8' markerHeight='8' refX='7' refY='3.5' orient='auto'><path d='M0,0 L7,3.5 L0,7 z' fill='#d62f3d'/></marker></defs>";
      var content = arr(data.architecture.connections).filter(function (connection) {
        return connectionVisible(connection, visibleIds);
      }).map(function (connection) {
        var fromNode = board.querySelector("[data-module-id='" + cssEscape(connection.fromModuleId) + "']");
        var toNode = board.querySelector("[data-module-id='" + cssEscape(connection.toModuleId) + "']");
        if (!fromNode || !toNode) return "";
        var fromRect = fromNode.getBoundingClientRect();
        var toRect = toNode.getBoundingClientRect();
        var x1 = fromRect.left - boardRect.left + fromRect.width / 2;
        var y1 = fromRect.bottom - boardRect.top;
        var x2 = toRect.left - boardRect.left + toRect.width / 2;
        var y2 = toRect.top - boardRect.top;
        if (y2 < y1) {
          x1 = fromRect.right - boardRect.left;
          y1 = fromRect.top - boardRect.top + fromRect.height / 2;
          x2 = toRect.left - boardRect.left;
          y2 = toRect.top - boardRect.top + toRect.height / 2;
        }
        var midY = y1 + (y2 - y1) * .5;
        var className = "connection-path";
        var marker = "arrow-current";
        if (connection.architectureScope === "target" || connection.lifecycle === "planned") { className += " is-target"; marker = "arrow-target"; }
        if (connection.lifecycle === "deprecating" || connection.lifecycle === "removed") { className += " is-deprecated"; marker = "arrow-deprecated"; }
        var path = "M " + x1 + " " + y1 + " C " + x1 + " " + midY + ", " + x2 + " " + midY + ", " + x2 + " " + y2;
        var labelX = (x1 + x2) / 2;
        var labelY = (y1 + y2) / 2 - 4;
        return "<path class='" + className + "' data-connection-id='" + e(connection.id) + "' d='" + path + "' marker-end='url(#" + marker + ")'></path><text class='connection-label' x='" + labelX + "' y='" + labelY + "' text-anchor='middle'>" + e(connection.protocol || connection.communicationMode) + "</text>";
      }).join("");
      svg.innerHTML = defs + content;
    }
    function cssEscape(value) {

        var review = byId("review", version.reviewId);
        var delta = version.delta;
        return "<article class='timeline-item " + (version.id === state.selectedVersionId ? "is-selected" : "") + "'><span class='timeline-date'>" + e(shortDate(version.createdAt)) + "</span><button class='timeline-btn' type='button' data-version-id='" + e(version.id) + "'><div class='version-title'><span>" + e(version.label) + "</span>" + status(version.status) + "</div><p>" + e(version.summary) + "</p><p class='cell-sub'><strong>Rationale — </strong>" + e(version.rationale) + "</p><div class='delta-line'><span class='delta-add'>+ " + delta.addedModuleIds.length + " modules</span><span class='delta-mod'>~ " + delta.modifiedModuleIds.length + " modules</span><span class='delta-remove'>− " + delta.removedModuleIds.length + " modules</span><span>Review " + e(review ? humanize(review.status) : "Missing") + "</span></div></button></article>";
      }).join("");
      var stageRail = stages.map(function (stage, index) {
        return "<button class='stage-btn " + (stage.id === selectedStage.id ? "is-selected" : "") + "' type='button' data-stage-id='" + e(stage.id) + "'><span class='stage-index'>" + (index + 1) + "</span><strong>" + e(stage.name) + "</strong><span class='stage-status'>" + status(stage.status) + "</span></button>";
      }).join("");
      document.getElementById("view-evolution").innerHTML =
        sectionHeading("Architecture Timeline", versions.length + " versions") + "<div class='timeline' style='--timeline-columns:" + versions.length + "'>" + timelineHtml + "</div>" +
        "<div class='section-rule'>" + sectionHeading("Stage Roadmap", stages.length + " stages") + "<div class='stage-rail' style='--stage-columns:" + stages.length + "'>" + stageRail + "</div>" + stageDetail(selectedStage) + "</div>" +
        "<div class='section-rule'>" + sectionHeading("Stage × Module Status", selectedStage.name) + stageModuleTable(selectedStage) + "</div>" +
        "<div class='section-rule'>" + sectionHeading("Release & Deployment History", data.releases.length + " releases") + releaseHistory() + "</div>";
    }
    function acceptanceNames(ids) {
      return arr(ids).map(function (id) {
        var item = byId("acceptance", id);
        return item ? item.title + " · " + humanize(item.verificationStatus) : id;
      });
    }
    function stageDetail(stage) {
      var blockers = arr(stage.blockerDecisionIds).map(function (id) { return entityName("decision", id); }).concat(arr(stage.blockerRiskIds).map(function (id) { return entityName("risk", id); }));
      return "<div class='stage-detail'><div><h3>Selected Stage</h3><p><strong>" + e(stage.name) + "</strong><br>" + status(stage.status) + "</p></div><div><h3>Purpose</h3><p>" + e(stage.purpose) + "</p></div><div><h3>Current Focus</h3><p>" + e(stage.currentFocus || "No active focus.") + "</p></div><div><h3>Entry / Exit Acceptance</h3>" + list(acceptanceNames(stage.entryAcceptanceIds), "No entry criteria.") + "<div style='height:7px'></div>" + list(acceptanceNames(stage.exitAcceptanceIds), "No exit criteria.") + "</div><div><h3>Blockers / Dates</h3>" + list(blockers, "No blockers.") + "<p class='cell-sub' style='margin-top:8px'>" + e(stage.plannedStart || "—") + " → " + e(stage.plannedEnd || "—") + "</p></div></div>";
    }
    function stageModuleTable(stage) {
      var modules = arr(stage.moduleIds).map(function (id) { return byId("module", id); }).filter(Boolean);
      var rows = modules.map(function (module) {
        var activeWork = arr(module.workItemIds).map(function (id) { return byId("work_item", id); }).find(function (item) { return item && ["in_progress","blocked","review"].indexOf(item.status) >= 0; });
        var pending = arr(module.reviewIds).map(function (id) { return byId("review", id); }).filter(function (review) { return review && review.status === "pending"; });
        var blockers = arr(module.riskIds).map(function (id) { return byId("risk", id); }).filter(function (risk) { return risk && ["high","critical"].indexOf(risk.severity) >= 0 && risk.status !== "closed"; });
        return "<tr data-open-module='" + e(module.id) + "' class='clickable-row'><td><div class='cell-title'>" + e(module.name) + "</div><div class='cell-sub mono'>" + e(module.id) + "</div></td><td>" + status(module.status.designMaturity) + "</td><td>" + status(module.status.implementationMaturity) + "</td><td>" + status(module.status.verificationStatus) + "</td><td>" + status(module.status.runtimeStatus) + "</td><td>" + (activeWork ? e(activeWork.title) + "<div class='cell-sub mono'>" + e(activeWork.id) + "</div>" : "—") + "</td><td>" + (pending.length ? pending.map(function (review) { return e(review.id); }).join(", ") : "—") + "</td><td>" + (blockers.length ? "<span class='severity-text'>" + e(blockers.map(function (risk) { return risk.title; }).join(", ")) + "</span>" : "—") + "</td></tr>";
      }).join("");
      return "<div class='table-wrap'><table><thead><tr><th>Module</th><th>Design</th><th>Implementation</th><th>Verification</th><th>Runtime</th><th>Current Work Item</th><th>Pending Review</th><th>Blocker</th></tr></thead><tbody>" + (rows || "<tr><td colspan='8'>No Module mapped to this Stage.</td></tr>") + "</tbody></table></div>";
    }
    function releaseHistory() {
      var rows = arr(data.releases).slice().sort(function (a,b) { return String(b.createdAt).localeCompare(String(a.createdAt)); }).map(function (release) {
        var architecture = byId("architecture_version", release.architectureVersionId);
        var stage = byId("stage", release.stageId);
        var deployments = arr(release.deploymentIds).map(function (id) { return byId("deployment", id); }).filter(Boolean);
        var artifacts = deployments.flatMap(function (deployment) { return arr(deployment.moduleDeployments); }).map(function (item) { return entityName("module", item.moduleId) + " " + item.artifactVersion; });
        var resources = Array.from(new Set(deployments.flatMap(function (deployment) { return arr(deployment.resourceIds); }))).map(function (id) { return entityName("resource", id); });
        return "<tr><td><div class='cell-title'>" + e(release.version) + "</div><div class='cell-sub'>" + e(release.name) + "</div></td><td>" + e(architecture ? architecture.label : release.architectureVersionId) + "</td><td>" + e(stage ? stage.name : release.stageId) + "</td><td>" + status(release.status) + "</td><td>" + (deployments.length ? deployments.map(function (deployment) { return e(humanize(deployment.environment)) + " · " + humanize(deployment.status); }).join("<br>") : "—") + "</td><td class='mono'>" + e(artifacts.join(" · ") || "—") + "</td><td>" + e(resources.join(", ") || "—") + "</td></tr>";
      }).join("");
      return "<div class='table-wrap'><table><thead><tr><th>Release</th><th>Architecture Version</th><th>Stage</th><th>Status</th><th>Deployment</th><th>Module artifactVersion</th><th>Resources</th></tr></thead><tbody>" + rows + "</tbody></table></div>";
    }

    function showToast(message) {
      var toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("is-visible");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(function () { toast.classList.remove("is-visible"); }, 1800);
    }
    function copyText(value) {
      var text = String(value == null ? "" : value);
      if (!text) { showToast("Nothing to copy"); return; }
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(function () { showToast("Copied to clipboard"); }).catch(function () { fallbackCopy(text); });
      } else fallbackCopy(text);
    }
    function fallbackCopy(text) {
      var area = document.createElement("textarea");
      area.value = text; area.setAttribute("readonly", ""); area.style.position = "fixed"; area.style.opacity = "0";
      document.body.appendChild(area); area.select();
      try { document.execCommand("copy"); showToast("Copied to clipboard"); }
      catch (error) { showToast("Copy unavailable"); }
      area.remove();
    }

    document.addEventListener("click", function (event) {
      var target = event.target.closest("button, tr[data-resource-id], tr[data-open-module]");
      if (!target) return;
      if (target.dataset.view) { state.view = target.dataset.view; updateVisibleView(); if (state.view === "system") renderSystem(); window.scrollTo({ top: 0, behavior: "auto" }); return; }
      if (target.dataset.systemView) { state.systemView = target.dataset.systemView; renderSystem(); window.scrollTo({ top: 0, behavior: "auto" }); return; }
      if (target.dataset.architectureMode) { state.architectureMode = target.dataset.architectureMode; renderLogical(); return; }
      if (target.dataset.moduleId) { renderDrawer(target.dataset.moduleId); return; }
      if (target.dataset.openModule) { renderDrawer(target.dataset.openModule); return; }
      if (target.dataset.resourceId) { state.selectedResourceId = target.dataset.resourceId; renderRuntime(); return; }
      if (target.dataset.environment) { state.selectedEnvironment = target.dataset.environment; state.selectedResourceId = null; renderRuntime(); return; }
      if (target.dataset.stageId) { state.selectedStageId = target.dataset.stageId; renderEvolution(); return; }
      if (target.dataset.versionId) { state.selectedVersionId = target.dataset.versionId; renderEvolution(); return; }
      if (target.dataset.action === "close-drawer") { closeDrawer(); return; }
      if (target.dataset.action === "clear-module-filters") {
        state.moduleSearch = ""; state.layerFilter = "all"; state.sourceFilter = "all"; state.statusFilter = "all"; renderLogical(); return;
      }
      if (target.dataset.action === "toggle-attention") { state.attentionExpanded = !state.attentionExpanded; renderControl(); return; }
      if (target.dataset.copyValue !== undefined) { copyText(target.dataset.copyValue); return; }
      if (target.dataset.revealResource) {
        var revealKey = target.dataset.revealResource + ":" + target.dataset.revealField;
        state.revealedSecrets[revealKey] = !state.revealedSecrets[revealKey]; renderRuntime(); return;
      }
      if (target.dataset.copySecretResource) {
        var resource = resourceForId(target.dataset.copySecretResource);
        var fields = resource && resource.access && resource.access.credentials && resource.access.credentials.fields;
        copyText(fields ? fields[target.dataset.copySecretField] : ""); return;
      }
    });
    document.getElementById("drawer-backdrop").addEventListener("click", closeDrawer);
    document.addEventListener("keydown", function (event) { if (event.key === "Escape") closeDrawer(); });
    document.addEventListener("change", function (event) {
      var filter = event.target.dataset.filter;
      if (!filter) return;
      if (filter === "layer-filter") state.layerFilter = event.target.value;
      if (filter === "source-filter") state.sourceFilter = event.target.value;
      if (filter === "status-filter") state.statusFilter = event.target.value;
      if (filter === "requirement-type") state.requirementFilters.type = event.target.value;
      if (filter === "requirement-definition") state.requirementFilters.definition = event.target.value;
      if (filter === "requirement-fulfillment") state.requirementFilters.fulfillment = event.target.value;
      if (filter.indexOf("requirement-") === 0) renderControl(); else renderLogical();
    });
    document.addEventListener("input", function (event) {
      if (event.target.dataset.filter === "module-search") {
        state.moduleSearch = event.target.value;
        window.clearTimeout(renderLogical.searchTimer);
        renderLogical.searchTimer = window.setTimeout(renderLogical, 100);
      }
    });
    window.addEventListener("resize", function () {
      if (state.view === "system" && state.systemView === "logical") {
        window.clearTimeout(drawConnections.resizeTimer);
        drawConnections.resizeTimer = window.setTimeout(drawConnections, 100);
      }
    });
  }());
  </script>
</body>
</html>
