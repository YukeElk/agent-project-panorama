<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Agent Project Panorama · Multi-view</title>
  <style>
    :root{--bg:#080d16;--panel:#101827;--panel2:#151f31;--text:#e9f0fb;--muted:#8fa1bb;--rule:#26344a;--accent:#7dd3fc;--accent2:#a78bfa;--good:#5ee6a8;--risk:#fb7185;--shadow:0 22px 70px #0008;--node:#142238;--edge:#62748e}
    html[data-theme=light]{--bg:#eef3f9;--panel:#fff;--panel2:#f6f8fc;--text:#162033;--muted:#65748b;--rule:#d9e1ec;--accent:#087aa9;--accent2:#7157c8;--good:#16865b;--risk:#d33f5d;--shadow:0 18px 55px #50627a22;--node:#fff;--edge:#8594a8}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}.app{height:100vh;display:grid;grid-template-rows:58px 1fr}
    .top{display:flex;align-items:center;gap:16px;padding:0 18px;border-bottom:1px solid var(--rule);background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(18px);z-index:4}.brand{font-weight:780;letter-spacing:.02em;white-space:nowrap}.brand small{display:block;color:var(--muted);font:10px/1.1 ui-monospace,monospace}.tabs{display:flex;gap:5px;min-width:0;overflow:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button,.icon-btn{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:9px;padding:8px 11px;cursor:pointer;white-space:nowrap}.tabs button:hover,.icon-btn:hover{background:var(--panel2);color:var(--text)}.tabs button.active{border-color:color-mix(in srgb,var(--accent) 45%,var(--rule));color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
    .actions{margin-left:auto;display:flex;gap:4px}.shell{min-height:0;display:grid;grid-template-columns:260px minmax(0,1fr) 330px}.side,.drawer{background:var(--panel);min-height:0;overflow:auto}.side{border-right:1px solid var(--rule);padding:16px;overflow-x:hidden}.drawer{position:relative;border-left:1px solid var(--rule);padding:18px;overflow-x:hidden}.drawer pre{white-space:pre-wrap;word-break:break-word}.drawer-close{position:absolute;right:8px;top:8px}
    .canvas-wrap{position:relative;min-width:0;min-height:0;overflow:hidden;background:radial-gradient(circle at 20% 20%,color-mix(in srgb,var(--accent) 7%,transparent),transparent 30%),linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);background-size:auto,28px 28px,28px 28px}.canvas{width:100%;height:100%;touch-action:none;cursor:grab}.canvas.dragging{cursor:grabbing}.viewport{transform-origin:0 0}
    .search,select{width:100%;border:1px solid var(--rule);border-radius:10px;background:var(--panel2);color:var(--text);padding:10px 11px;outline:none}.search:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent)}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.control label{display:block;margin:0 0 4px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.meta{margin:14px 0;padding:12px;border:1px solid var(--rule);border-radius:12px;background:var(--panel2)}.meta b{display:block;margin-bottom:4px}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;overflow-wrap:anywhere;color:var(--muted)}
    .legend{display:grid;gap:7px;margin-top:18px}.legend span{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.dot{width:9px;height:9px;border-radius:99px;background:var(--accent)}.dot.risk{background:var(--risk)}.dot.declared{border:2px solid var(--accent2);background:transparent}.gap{margin-top:16px;padding:10px;border-left:2px solid var(--risk);background:color-mix(in srgb,var(--risk) 7%,transparent);color:var(--muted);font-size:12px;overflow-wrap:anywhere}
    .node rect{fill:var(--node);stroke:var(--rule);stroke-width:1.3;filter:drop-shadow(0 7px 12px #0003)}.node text{fill:var(--text);pointer-events:none}.node .sub{fill:var(--muted);font-size:10px}.node:hover rect,.node.selected rect{stroke:var(--accent);stroke-width:2}.node.risk rect{stroke:var(--risk)}.node.dim,.edge-group.dim{opacity:.14}.edge{fill:none;stroke:var(--edge);stroke-width:1.5;pointer-events:none}.edge-hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}.edge-group:hover .edge{stroke:var(--accent);stroke-width:2}.edge-group.risk .edge{stroke:var(--risk)}.edge-label{fill:var(--muted);font-size:10px;pointer-events:none}.lifeline{stroke:var(--rule);stroke-dasharray:5 5}.seq-message{stroke:var(--accent);stroke-width:1.5}
    .empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);pointer-events:none}.empty[hidden]{display:none}.drawer h2{font-size:17px;margin:0 30px 4px 0}.drawer h3{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:20px 0 8px}.chip{display:inline-flex;border:1px solid var(--rule);border-radius:99px;padding:4px 8px;margin:3px 3px 0 0;font-size:11px;color:var(--muted)}.evidence{padding:9px 0;border-bottom:1px solid var(--rule)}.hint{position:absolute;left:14px;bottom:12px;padding:7px 10px;border:1px solid var(--rule);border-radius:9px;background:var(--panel);color:var(--muted);font-size:11px;box-shadow:var(--shadow)}button:focus-visible,.node:focus-visible,.edge-group:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    @media(max-width:1000px){.shell{grid-template-columns:210px minmax(0,1fr)}.drawer{position:absolute;right:0;top:58px;bottom:0;width:min(360px,88vw);z-index:5;box-shadow:var(--shadow)}.drawer.closed{display:none}}
    @media(max-width:839px){body{overflow:auto}.app{height:auto;min-height:100vh;grid-template-rows:auto 1fr}.top{position:sticky;top:0;display:grid;grid-template-columns:minmax(0,1fr) auto;height:auto;padding:9px 12px;gap:6px 10px}.actions{grid-column:2;grid-row:1}.tabs{grid-column:1/-1;grid-row:2}.shell{display:block}.side{border-right:0;border-bottom:1px solid var(--rule)}.canvas-wrap{height:68vh}.drawer{position:fixed;top:0}.brand small{display:none}.hint{max-width:calc(100% - 28px)}}
    @media(max-width:430px){.controls{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="app"><header class="top"><div class="brand">Agent Project Panorama<small id="binding"></small></div><nav class="tabs" id="tabs" aria-label="视图切换"></nav><div class="actions"><button class="icon-btn" id="fit" type="button">Fit</button><button class="icon-btn" id="theme" type="button" aria-label="切换主题">◐</button></div></header><main class="shell"><aside class="side"><input class="search" id="search" type="search" placeholder="搜索实体 / ID" aria-label="搜索实体"><div class="controls"><div class="control"><label for="fact-filter">事实筛选</label><select id="fact-filter"><option value="all">全部</option><option value="observed">Observed</option><option value="declared">Declared / Derived</option><option value="risk">Risk</option><option value="evidence_gap">Evidence Gap</option><option value="scope_current">Scope: Current</option><option value="scope_target">Scope: Target</option><option value="scope_transition">Scope: Transition</option><option value="scope_historical">Scope: Historical</option><option value="freshness_current">Freshness: Current</option><option value="freshness_recorded">Freshness: Recorded</option><option value="freshness_stale">Freshness: Stale</option></select></div><div class="control"><label for="trace-mode">关系 Trace</label><select id="trace-mode"><option value="neighbors">相邻</option><option value="upstream">上游</option><option value="downstream">下游</option><option value="connected">双向可达</option></select></div></div><div class="meta" id="view-meta" aria-live="polite"></div><div class="legend"><span><i class="dot"></i>Observed / bound</span><span><i class="dot declared"></i>Declared / derived</span><span><i class="dot risk"></i>Risk emphasis</span></div><div id="gaps"></div></aside><section class="canvas-wrap"><svg class="canvas" id="canvas" role="img" aria-label="项目多视图图形"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--edge)"/></marker></defs><g class="viewport" id="viewport"></g></svg><div class="empty" id="empty" hidden>当前筛选没有可显示关系</div><div class="hint">滚轮缩放 · 拖拽平移 · Enter 查看详情</div></section><aside class="drawer closed" id="drawer"><button class="icon-btn drawer-close" id="close-drawer" type="button" aria-label="关闭详情">×</button><div id="details"><p style="color:var(--muted)">选择节点或关系查看 Model/Evidence 绑定。</p></div></aside></main></div>
<script id="panorama-view-bundle" type="application/json">__PANORAMA_VIEW_BUNDLE__</script>
<script>
(()=>{"use strict";
const bundle=JSON.parse(document.getElementById("panorama-view-bundle").textContent),model=bundle.model,views=bundle.views,entities=new Map(model.entities.map(x=>[x.id,x])),relations=new Map(model.relations.map(x=>[x.id,x]));
const S={view:views[0],scale:1,tx:20,ty:20,q:"",filter:"all",trace:"neighbors",selected:null,selectedEntity:null,selectedRelation:null,drag:null,bounds:null},$=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
$("binding").textContent=model.projectBinding.projectId+" · "+bundle.bundleId;
function profileLabel(p){return({module:"模块",dependency_dataflow:"依赖 / 数据流",deployment_runtime:"部署",sequence:"时序",lifecycle:"生命周期",evolution_risk:"演进 / 风险"})[p]||p}function tabs(){$("tabs").innerHTML=views.map(v=>`<button type="button" data-view="${esc(v.viewId)}" class="${v.viewId===S.view.viewId?"active":""}">${esc(profileLabel(v.profile))}</button>`).join("")}function nodeMatch(n){if(S.q&&!(n.label+" "+n.entityRef.id).toLowerCase().includes(S.q))return false;const entity=entities.get(n.entityRef.id),pins=(entity&&entity.evidencePins)||[],scopes=(entity&&entity.architectureScopes)||[];if(S.filter==="observed")return n.authority==="observed"||n.factStatus==="observed";if(S.filter==="declared")return n.authority==="declared"||n.authority==="derived"||n.factStatus==="declared"||n.factStatus==="derived";if(S.filter==="risk")return n.emphasis==="risk";if(S.filter==="evidence_gap")return !pins.length;if(S.filter.startsWith("scope_"))return scopes.includes(S.filter.slice(6));if(S.filter==="freshness_current")return pins.some(pin=>pin.freshness==="current");if(S.filter==="freshness_recorded")return pins.some(pin=>pin.freshness==="recorded_as_of");if(S.filter==="freshness_stale")return pins.some(pin=>pin.freshness==="stale");return true}
function generalLayout(v){const ns=v.nodes.filter(nodeMatch),ids=new Set(ns.map(n=>n.id)),pos=new Map(),rank=new Map(),incoming=new Map(),outgoing=new Map();ns.forEach(n=>{rank.set(n.id,0);incoming.set(n.id,0);outgoing.set(n.id,[])});v.edges.filter(e=>ids.has(e.fromNodeId)&&ids.has(e.toNodeId)&&e.fromNodeId!==e.toNodeId).forEach(e=>{incoming.set(e.toNodeId,incoming.get(e.toNodeId)+1);outgoing.get(e.fromNodeId).push(e.toNodeId)});const queue=ns.filter(n=>incoming.get(n.id)===0).map(n=>n.id).sort(),seen=new Set();while(queue.length){const id=queue.shift();seen.add(id);for(const target of outgoing.get(id).slice().sort()){rank.set(target,Math.max(rank.get(target),rank.get(id)+1));incoming.set(target,incoming.get(target)-1);if(incoming.get(target)===0)queue.push(target)}queue.sort()}ns.filter(n=>!seen.has(n.id)).sort((a,b)=>a.id.localeCompare(b.id)).forEach((n,i)=>rank.set(n.id,i%2));const buckets=new Map();ns.forEach(n=>{const r=rank.get(n.id);if(!buckets.has(r))buckets.set(r,[]);buckets.get(r).push(n)});for(const bucket of buckets.values())bucket.sort((a,b)=>a.label.localeCompare(b.label)||a.id.localeCompare(b.id));let maxRank=0,maxRows=0;for(const [r,bucket] of buckets){maxRank=Math.max(maxRank,r);maxRows=Math.max(maxRows,bucket.length);bucket.forEach((n,i)=>pos.set(n.id,{x:65+r*255,y:55+i*122}))}return{nodes:ns,pos,w:190,h:74,bounds:{x:30,y:25,w:Math.max(260,65+maxRank*255+225),h:Math.max(180,55+maxRows*122)}}}
function sequenceLayout(v){const ns=v.nodes.filter(nodeMatch),pos=new Map();ns.forEach((n,i)=>pos.set(n.id,{x:60+i*205,y:42}));const visible=new Set(ns.map(n=>n.id)),edgeCount=v.edges.filter(e=>visible.has(e.fromNodeId)&&visible.has(e.toNodeId)).length;return{nodes:ns,pos,w:150,h:54,sequence:true,bounds:{x:25,y:20,w:Math.max(250,60+ns.length*205),h:Math.max(300,165+edgeCount*58)}}}
function routeEdge(a,b,w,h){const x1=a.x+w,y1=a.y+h/2,x2=b.x,y2=b.y+h/2;if(x2>=x1+45){const mid=(x1+x2)/2;return{d:`M${x1} ${y1} L${mid} ${y1} L${mid} ${y2} L${x2} ${y2}`,lx:mid+5,ly:(y1+y2)/2-7}}const bendY=Math.max(a.y+h,b.y+h)+32;return{d:`M${x1} ${y1} L${x1+28} ${y1} L${x1+28} ${bendY} L${x2-28} ${bendY} L${x2-28} ${y2} L${x2} ${y2}`,lx:(x1+x2)/2,ly:bendY-7}}
function edgeGroup(e,path,label,x,y,dim,risk,showLabel){return `<g class="edge-group ${dim?"dim":""} ${risk?"risk":""}" data-edge="${esc(e.id)}" data-from="${esc(e.fromNodeId)}" data-to="${esc(e.toNodeId)}" tabindex="0" role="button" aria-label="${esc(label)}"><title>${esc(label)}</title><path class="edge-hit" d="${path}"/><path class="edge" d="${path}" marker-end="url(#arrow)"/>${showLabel?`<text class="edge-label" x="${x}" y="${y}" text-anchor="middle">${esc(label)}</text>`:""}</g>`}
function traceFocus(edges){const focus=new Set();if(!S.selected)return focus;focus.add(S.selected);if(S.trace==="neighbors"){edges.forEach(e=>{if(e.fromNodeId===S.selected)focus.add(e.toNodeId);if(e.toNodeId===S.selected)focus.add(e.fromNodeId)});return focus}if(S.trace==="connected"){const queue=[S.selected];while(queue.length){const id=queue.shift();edges.forEach(e=>{const next=e.fromNodeId===id?e.toNodeId:e.toNodeId===id?e.fromNodeId:null;if(next&&!focus.has(next)){focus.add(next);queue.push(next)}})}return focus}const walk=direction=>{const queue=[S.selected],seen=new Set(queue);while(queue.length){const id=queue.shift();edges.forEach(e=>{const next=direction==="downstream"&&e.fromNodeId===id?e.toNodeId:direction==="upstream"&&e.toNodeId===id?e.fromNodeId:null;if(next&&!seen.has(next)){seen.add(next);focus.add(next);queue.push(next)}})}};if(S.trace==="upstream")walk("upstream");if(S.trace==="downstream")walk("downstream");return focus}
function render(){
  tabs();const v=S.view,layout=v.profile==="sequence"?sequenceLayout(v):generalLayout(v);S.bounds=layout.bounds;
  const visible=new Set(layout.nodes.map(n=>n.id)),edges=v.edges.filter(e=>visible.has(e.fromNodeId)&&visible.has(e.toNodeId)),focus=traceFocus(edges);
  let out=`<g transform="translate(${S.tx} ${S.ty}) scale(${S.scale})">`;
  if(layout.sequence){
    layout.nodes.forEach(n=>{const p=layout.pos.get(n.id);out+=`<line class="lifeline" x1="${p.x+75}" y1="${p.y+54}" x2="${p.x+75}" y2="${Math.max(300,120+edges.length*58)}"/>`});
    edges.forEach((e,i)=>{const a=layout.pos.get(e.fromNodeId),b=layout.pos.get(e.toNodeId),y=135+i*58;if(!a||!b)return;const d=`M${a.x+75} ${y} L${b.x+75} ${y}`,label=`#${e.order} · ${e.label}`,dim=Boolean(S.selected&&!(focus.has(e.fromNodeId)&&focus.has(e.toNodeId)));out+=edgeGroup(e,d,label,(a.x+b.x)/2+75,y-7,dim,e.emphasis==="risk",true)});
  }else{
    edges.forEach(e=>{const a=layout.pos.get(e.fromNodeId),b=layout.pos.get(e.toNodeId);if(!a||!b)return;const route=routeEdge(a,b,layout.w,layout.h),dim=Boolean(S.selected&&!(focus.has(e.fromNodeId)&&focus.has(e.toNodeId)));out+=edgeGroup(e,route.d,e.label,route.lx,route.ly,dim,e.emphasis==="risk",edges.length<=8)});
  }
  layout.nodes.forEach(n=>{const p=layout.pos.get(n.id),dim=Boolean(S.selected&&!focus.has(n.id)),risk=n.emphasis==="risk";out+=`<g class="node ${S.selected===n.id?"selected":""} ${risk?"risk":""} ${dim?"dim":""}" data-node="${esc(n.id)}" tabindex="0" role="button" aria-label="${esc(n.label)}" transform="translate(${p.x} ${p.y})"><title>${esc(n.label)} · ${esc(n.entityRef.id)}</title><rect width="${layout.w}" height="${layout.h}" rx="12"/><text x="14" y="27" font-weight="700">${esc(n.label.slice(0,26))}</text><text class="sub" x="14" y="47">${esc(n.entityRef.id.slice(0,28))}</text><text class="sub" x="14" y="63">${esc(n.factStatus)} · ${esc(n.authority)}</text></g>`});
  out+="</g>";$("viewport").innerHTML=out;$("empty").hidden=layout.nodes.length>0;const trace=S.selected?`<br>Trace · ${esc(S.trace)} · ${focus.size} nodes`:"";$("view-meta").innerHTML=`<b>${esc(v.title)}</b><div>${esc(v.description)}</div><p class="mono">${esc(v.viewId)}<br>${layout.nodes.length} nodes · ${edges.length} edges${trace}</p>`;$("gaps").innerHTML=v.informationGaps.length?`<div class="gap"><b>Information gaps</b><br>${v.informationGaps.map(esc).join("<br>")}</div>`:"";bindGraph();
}
function fitView(){if(!S.bounds)return;const svg=$("canvas"),cw=svg.clientWidth||800,ch=svg.clientHeight||600,pad=42,b=S.bounds;S.scale=Math.max(.35,Math.min(1.25,Math.min((cw-pad*2)/b.w,(ch-pad*2)/b.h)));S.tx=(cw-b.w*S.scale)/2-b.x*S.scale;S.ty=(ch-b.h*S.scale)/2-b.y*S.scale;render()}
function syncHash(kind,id){const p=new URLSearchParams();p.set("view",S.view.viewId);if(kind&&id)p.set(kind,id);if(S.trace!=="neighbors")p.set("trace",S.trace);history.replaceState(null,"","#"+p.toString())}
function evidence(item){const pins=(item&&item.evidencePins)||[];return pins.length?pins.map(p=>`<div class="evidence"><b>${esc(p.kind)}</b><div class="mono">${esc(p.ref)}<br>${esc(p.digest||"digest unavailable")}</div><span class="chip">${esc(p.freshness)}</span><span class="chip">${esc(p.accessClass)}</span></div>`).join(""):"<p>没有 Evidence Pin。</p>"}
function relationActions(nodeId){const attached=S.view.edges.filter(edge=>edge.fromNodeId===nodeId||edge.toNodeId===nodeId);return attached.length?attached.map(edge=>`<button type="button" class="icon-btn" data-relation-action="${esc(edge.id)}">${esc(edge.label)}</button>`).join(""):"<p>当前 View 没有直接关系。</p>"}
function showNode(id){const n=S.view.nodes.find(x=>x.id===id),e=n&&entities.get(n.entityRef.id);if(!n||!e)return;S.selected=id;S.selectedEntity=e.id;S.selectedRelation=null;syncHash("entity",e.id);$("details").innerHTML=`<h2>${esc(e.name)}</h2><div class="mono">${esc(e.id)}</div><span class="chip">${esc(e.kind)}</span><span class="chip">${esc(e.factStatus)}</span><span class="chip">${esc(e.authority)}</span><h3>Purpose</h3><p>${esc(e.purpose||"未提供")}</p><h3>Relations</h3>${relationActions(n.id)}<h3>Attributes</h3><pre class="mono">${esc(JSON.stringify(e.attributes,null,2))}</pre><h3>Evidence</h3>${evidence(e)}`;$("drawer").classList.remove("closed");render()}
function showEdge(id){const edge=S.view.edges.find(x=>x.id===id),r=edge&&relations.get(edge.relationRef.id);if(!r)return;S.selectedRelation=r.id;syncHash("relation",r.id);$("details").innerHTML=`<h2>${esc(r.name)}</h2><div class="mono">${esc(r.id)}</div><span class="chip">${esc(r.kind)}</span><span class="chip">order=${esc(r.semantics.order)}</span><h3>Binding</h3><p class="mono">${esc(r.fromEntityId)} → ${esc(r.toEntityId)}</p><h3>Semantics</h3><pre class="mono">${esc(JSON.stringify(r.semantics,null,2))}</pre><h3>Evidence</h3>${evidence(r)}`;$("drawer").classList.remove("closed")}
function bindGraph(){document.querySelectorAll("[data-node]").forEach(el=>{el.onclick=()=>showNode(el.dataset.node);el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();showNode(el.dataset.node)}}});document.querySelectorAll("[data-edge]").forEach(el=>{el.onclick=()=>showEdge(el.dataset.edge);el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();showEdge(el.dataset.edge)}}});document.querySelectorAll("[data-relation-action]").forEach(el=>el.onclick=()=>showEdge(el.dataset.relationAction))}
$("tabs").onclick=e=>{const id=e.target.dataset.view;if(!id)return;S.view=views.find(v=>v.viewId===id);const carried=S.selectedEntity&&S.view.nodes.find(n=>n.entityRef.id===S.selectedEntity);S.selected=carried?carried.id:null;S.selectedRelation=null;syncHash(carried?"entity":null,carried?carried.entityRef.id:null);render();fitView()};
$("tabs").onkeydown=e=>{if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight")return;const buttons=[...$("tabs").querySelectorAll("button")],current=buttons.indexOf(document.activeElement),delta=e.key==="ArrowRight"?1:-1,next=buttons[(current+delta+buttons.length)%buttons.length],nextId=next.dataset.view;e.preventDefault();next.click();requestAnimationFrame(()=>$("tabs").querySelector(`[data-view="${nextId}"]`)?.focus())};
