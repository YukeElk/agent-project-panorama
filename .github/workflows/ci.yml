name: Panorama CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install jsonschema pytest
      - run: python -m pytest -q
      - run: node tests/test_url_sanitizer.js
      - run: python scripts/validate_panorama.py examples/reference-project.v0.1.json
      - run: python scripts/init_panorama.py --template templates/panorama.html --data examples/reference-project.v0.1.json --output generated-reference.html
      - run: python scripts/validate_panorama.py generated-reference.html
      - name: Verify Presentation Hash
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "scripts")
          from panorama_io import compute_presentation_hash
          template = Path("templates/panorama.html").read_text(encoding="utf-8")
          generated = Path("generated-reference.html").read_text(encoding="utf-8")
          assert compute_presentation_hash(template) == compute_presentation_hash(generated)
          PY
