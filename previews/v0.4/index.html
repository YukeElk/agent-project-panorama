else if(type==='requirement'){let map={'R-01':['研究目标与周期','用户可表达关注主题、来源偏好、执行周期。'],'R-02':['自动处理可信新知识','默认减少人工操作，但不允许模型绕过发布策略与质量门。'],'R-03':['发现冲突时定向送审','真实冲突须有两方证据、适用条件和精确版本。'],'R-04':['验证与可恢复性','结果区分文档声明、源码观察、测试和真实运行。']};let a=map[id]||['需求','待定义'];title=a[0];subtitle=`${id} · 需求草案`;body=`<div class="field-label">预期业务结果</div><div class="field-value">${a[1]}</div><div class="field-label">设计关联</div><div class="field-value">业务流程 / 功能能力 / 模块职责</div><div class="field-label">验证边界</div><div class="field-value">必须进一步绑定正式 Criterion 与 Evidence；此原型未执行真实验收。</div><div style="margin-top:23px">${action('查看对应设计','go-design-flow','btn sm')}</div>`;}
root.innerHTML=`<div class="backdrop" data-action="close-drawer"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><div class="drawer-head"><div><div class="eyebrow">上下文检查器</div><h2 id="drawer-title" style="margin-top:8px">${esc(title)}</h2><p class="blurb">${esc(subtitle)}</p></div><button class="btn icon-only" data-action="close-drawer" aria-label="关闭详情">${icon('close')}</button></div><div class="drawer-body">${body}</div></aside>`;
}
const tourSteps={
J1:[['创建项目','为新项目定义目标，不需要选择技术栈。','project','home'],['选择组成','只选择前端、后端等构成部分；可以以后修改。','project','requirements'],['进入设计','根据需求形成业务流程与能力划分。','design','flow']],
J2:[['理解目标','先看项目关注的业务场景。','project','home'],['聚焦架构','只看当前层级的相关能力与责任。','design','architecture'],['核对来源','通过模块上下文查看固定版本源码，区别声明与事实。','design','architecture']],
J3:[['提出场景','从自然语言业务目标开始。','project','scene'],['场景分析','查看已找到的能力与证据缺口。','project','explore'],['转入设计','把关键缺口与方案绑定到目标设计。','design','proposal']],
J4:[['查看流程','先验证业务处理方向。','design','flow'],['修改步骤','选择任意步骤，通过编辑形成设计草案。','design','flow'],['方案对比','比较修改范围、风险与替代路径。','design','proposal'],['确认目标','确认后才进入有边界的开发任务。','design','proposal']],
J5:[['选择设计版本','将已确认设计与执行任务绑定。','design','proposal'],['任务交接','选择 Codex / Claude Code，模拟执行。','development',null],['结果回读','执行结束仍需独立验证。','verification',null]],
J6:[['检查验收','查看缺少哪些真实证据。','verification',null],['诊断偏差','区分需求、设计和实现层次。','verification',null],['提出变更','比较多个方案并保存设计基线。','design','proposal'],['重新验收','复验新版本，历史失败记录仍保留。','verification',null]]};
function renderTour(){const root=document.getElementById('tour-root');if(!state.tour){root.innerHTML='';return;}const steps=tourSteps[state.tour.id]||[];const [t,desc]=steps[state.tour.step]||steps[0];const meta=tours.find(x=>x.id===state.tour.id);root.innerHTML=`<section class="tour" aria-label="演示旅程引导"><div class="row between"><div class="eyebrow">${meta.id} · ${state.tour.step+1}/${steps.length} 步</div><button class="ghost-btn" data-action="tour-close" aria-label="结束演示">${icon('close')}</button></div><h3 style="margin-top:8px">${t}</h3><div class="caption">${desc}</div><div class="actions"><button class="btn sm" data-action="tour-back" ${state.tour.step===0?'disabled':''}>上一步</button><button class="btn primary sm" data-action="tour-next">${state.tour.step===steps.length-1?'结束演示':'下一步'}</button></div></section>`;}
function runTour(id,step=0){const ts=tourSteps[id]||[],item=ts[step];if(!item)return;state.tour={id,step};if(item[2]==='project'){state.projectSub=item[3]||'home';setPage('project');}else if(item[2]==='design'){state.designTab=item[3]||'flow';setPage('design');}else{setPage(item[2]);}state.tour={id,step};renderTour();if(id==='J1'&&step===0)showModal('new');}
function setScenarioFromQuery(q){const text=q.trim();if(!text){notice('先描述想探索的场景。');return;}const known=Object.entries(scenarioData).find(([_id,obj])=>obj.prompt.trim()===text);if(known)state.scene=known[0];else{state.scene='custom';state.customQuery=text;}state.query=text;state.projectSub='explore';state.exploreCount++;log('探索业务场景：'+text.slice(0,70));setPage('project',{projectSub:'explore'});if(state.scene==='custom')notice('自定义场景已记录为探索态；未执行真实 AI 或项目事实检查。');}
function tourGo(delta){if(!state.tour)return;const id=state.tour.id,newIndex=state.tour.step+delta;if(newIndex<0)return;if(newIndex>=tourSteps[id].length){state.tour=null;renderTour();notice('演示旅程已完成，可以自由探索页面。');return;}runTour(id,newIndex);}
function act(e){const btn=e.target.closest('[data-action]');if(!btn||btn.disabled)return;const op=btn.dataset.action;
if(op==='go-dashboard'){setPage('project',{projectSub:'home'});return;}
if(op==='edit-project-requirements'){showModal('project-requirements');return;}
if(op.startsWith('home-attention-go-')){
 const a=homeAttentionItems().find(x=>x.id===op.slice('home-attention-go-'.length));if(!a)return;
 state.drawer=null;renderDrawer();
 if(a.target==='decision'){showModal('decision');return;}
 if(a.target==='project-home'){setPage('project',{projectSub:'scene'});return;}
 if(a.target==='design-flow'){if(a.selectedStep)state.selectedStep=a.selectedStep;setPage('design',{designTab:'flow'});return;}
 if(a.target==='design-proposal'){setPage('design',{designTab:'proposal'});return;}
 if(a.target==='development'||a.target==='verification'){setPage(a.target);return;}
}
if(op.startsWith('home-attention-')){showDrawer('attention',op.slice('home-attention-'.length));return;}
if(op==='close-modal'){state.modal=null;renderModal();return;}
if(op==='close-drawer'){state.drawer=null;renderDrawer();return;}
if(op.startsWith('nav-')){if(op==='nav-project')state.projectSub='home';setPage(op.slice(4));return;}
if(op.startsWith('project-')){state.projectSub=op.slice(8);setPage('project');return;}
if(op.startsWith('quick-')){const id=op.slice(6);state.scene=id;state.query=scenarioData[id].prompt;state.projectSub='explore';setPage('project',{projectSub:'explore'});return;}
if(op.startsWith('switch-scene-')){state.scene=op.slice(13);state.query=state.scene==='custom'?state.customQuery:scenarioData[state.scene]?.prompt||'';setPage('project',{projectSub:'explore'});return;}
if(op.startsWith('design-')){const tab=op.slice(7);if(tab==='approve'){const ck=document.getElementById('confirm-check');if(!ck?.checked){notice('请先确认这是模拟设计审批。');return;}state.designConfirmed=true;state.proposal=true;state.modal=null;log('设计草案 v'+state.designRevision+' 已在本地原型中确认');setPage('design',{designTab:'proposal'});notice('目标设计已模拟确认。可进入开发页检查任务契约。');return;}state.designTab=tab;render();return;}
if(op.startsWith('step-')){state.selectedStep=op.slice(5);if(state.page==='design'&&state.designTab==='flow')render();else{render();showDrawer('step',state.selectedStep)}return;}
if(op.startsWith('cap-')){showDrawer('cap',op.slice(4));return;}
if(op.startsWith('evidence-')){showDrawer('evidence',op.slice(9));return;}
if(op.startsWith('requirement-')){showDrawer('requirement',op.slice(12));return;}
if(op.startsWith('arch-')){state.selectedArch=op.slice(5);render();return;}
if(op.startsWith('preview-')){state.previewView=op.slice(8);render();return;}
if(op==='preview-next'){const a=['research','knowledge','decision'];state.previewView=a[(a.indexOf(state.previewView)+1)%a.length];render();return;}
if(op.startsWith('proposal-')){state.proposalChoice=op.slice(9);state.proposal=true;state.designConfirmed=false;render();return;}
if(op==='create-proposal'||op==='generate-proposal'){if(state.scene==='custom'){state.designTab='flow';setPage('design');notice('新场景需要先完成真实项目事实映射；当前展示可编辑的设计起点。');return;}state.proposal=true;state.designConfirmed=false;state.designTab='proposal';log('生成候选改进方案（演示）');setPage('design',{designTab:'proposal'});notice('候选方案已载入。尚未改变源码或执行任务。');return;}
if(op==='save-scene'){if(!state.savedScenes.includes(state.scene))state.savedScenes.push(state.scene);log('保存关注场景：'+scenario().title);render();notice('场景已保存到本浏览器的演示列表。');return;}
if(op==='edit-step'||op==='add-step'){showModal(op);return;}
if(op==='confirm-design'){showModal('confirm-design');return;}
if(op==='open-decision'){showModal('decision');return;}
if(op==='decision-ack'){state.modal=null;renderModal();notice('已保留风险驱动人工审核的设计原则（本地演示）。');return;}
if(op==='go-design-flow'||op==='go-design-proposal'){state.drawer=null;state.modal=null;setPage('design',{designTab:op==='go-design-flow'?'flow':'proposal'});return;}
if(op==='open-components'||op==='open-new'||op==='open-tour'||op==='open-search'||op==='open-task-contract'||op==='release-blockers'||op==='open-settings'){let map={'open-components':'components','open-new':'new','open-tour':'tour','open-search':'search','open-task-contract':'task-contract','release-blockers':'release-blockers','open-settings':'settings'};showModal(map[op]);return;}
if(op==='reset-confirm'){showModal('reset');return;}
if(op==='reset-confirmed'){state=makeDefault();clearTimeout(taskTimer);render();notice('演示状态已恢复初始 AI-Wiki 示例。');return;}
if(op.startsWith('tour-start-')){const id=op.slice(11);state.modal=null;runTour(id);return;}
if(op==='tour-close'){state.tour=null;renderTour();return;}
if(op==='tour-next'){tourGo(1);return;}
if(op==='tour-back'){tourGo(-1);return;}
if(op==='simulate-task'){
 if(!state.designConfirmed){notice('正式流程需要先确认目标设计；请在「设计 → 方案与变更」完成模拟确认。');return;}
 if(state.taskStatus!=='ready'){notice('当前任务不是待执行状态。');return;}
 state.taskStatus='running';state.lastTaskDesignRevision=state.designRevision;const sel=document.getElementById('agent-select')?.value||'Codex';state.attempts.unshift({at:new Date().toLocaleTimeString('zh-CN',{hour12:false}),message:'开始模拟执行 / '+sel+' / T-003 / target v'+state.designRevision});log('模拟派发任务 T-003 给 '+sel);render();notice('正在模拟执行；未调用真实 Coding Agent。');
 taskTimer=setTimeout(()=>{if(state.taskStatus!=='running')return;state.taskStatus='finished';state.attempts.unshift({at:new Date().toLocaleTimeString('zh-CN',{hour12:false}),message:'演示执行结束 · 产物示意 · 尚未获得正式验收'});log('模拟任务执行结束，待验证');render();notice('执行模拟完成。请到「验证」检查独立验收。');},1700);return;}
if(op==='simulate-verify'){state.validationRun=true;log('进行场景模拟复验；未执行真实测试');render();notice('模拟复验已完成；没有取得生产证据。');return;}
if(op==='open-evidence'){showDrawer('evidence','E-106');return;}
}
function onSubmit(e){if(e.target.id==='scenario-form'){e.preventDefault();setScenarioFromQuery(document.getElementById('scenario-input')?.value||'');return;}
if(e.target.id==='new-form'){e.preventDefault();const name=document.getElementById('new-name')?.value.trim(),goal=document.getElementById('new-goal')?.value.trim();if(!name||!goal){notice('项目名称与目标必填。');return;}state={...makeDefault(),projectName:name,projectGoal:goal,isSample:false,projectRequirements:[{id:'PR-01',title:'核心业务需求',detail:goal}],requirementRevision:1,editingRequirements:false,components:[...document.querySelectorAll('.new-component:checked')].map(el=>el.value),scene:'custom',query:goal,customQuery:goal,savedScenes:[],designConfirmed:false,page:'project',projectSub:'home',tour:state.tour};log('创建演示项目 '+name);render();notice('已建立浏览器内项目草案；没有创建真实文件。');return;}
if(e.target.id==='project-requirements-form'){
 e.preventDefault();const goal=document.getElementById('edit-project-goal')?.value.trim();
 const originals=state.projectRequirements||[];const titles=[...document.querySelectorAll('.edit-requirement-title')];const descriptions=[...document.querySelectorAll('.edit-requirement-detail')];
 if(!goal||titles.length!==originals.length||descriptions.length!==originals.length){notice('请填写完整项目目标与需求。');return;}
 const updated=originals.map((r,i)=>({...r,title:(titles[i]?.value||'').trim(),detail:(descriptions[i]?.value||'').trim()}));
 if(updated.some(r=>!r.title||!r.detail)){notice('需求名称和内容不能为空。');return;}
 const changed=goal!==state.projectGoal||updated.some((r,i)=>r.title!==originals[i].title||r.detail!==originals[i].detail);
 if(changed){state.projectGoal=goal;state.projectRequirements=updated;state.requirementRevision=(Number(state.requirementRevision)||1)+1;log('编辑项目需求草案 v'+state.requirementRevision);}
 state.modal=null;setPage('project',{projectSub:'requirements'});notice(changed?'项目需求草案已保存在本浏览器中。':'需求未变化。');return;
 }
if(e.target.id==='components-form'){e.preventDefault();const next=[...document.querySelectorAll('.project-component:checked')].map(el=>el.value),before=state.components;state.components=next;state.modal=null;state.designConfirmed=false;state.designRevision++;state.taskStatus='ready';state.validationRun=false;log('项目组成发生演示变更：'+next.join(', '));render();notice(`已保存组成变更（增加 ${next.filter(x=>!before.includes(x)).length}，移除 ${before.filter(x=>!next.includes(x)).length}）。相关设计需要影响核对。`);return;}
if(e.target.id==='edit-step-form'){e.preventDefault();const title=document.getElementById('step-title')?.value.trim(),desc=document.getElementById('step-desc')?.value.trim();if(!title||!desc)return;const s=currentSteps().find(x=>x.id===state.selectedStep);if(!s)return; if(state.extraSteps.some(x=>x.id===s.id)){const x=state.extraSteps.find(x=>x.id===s.id);x.title=title;x.desc=desc;}else state.flowEdits[s.id]={title,desc};state.designRevision++;state.designConfirmed=false;state.taskStatus='ready';state.validationRun=false;state.modal=null;log('编辑目标设计步骤 '+s.id);render();notice('设计草案已更新。既有确认失效，需要重新评审。');return;}
if(e.target.id==='add-step-form'){e.preventDefault();const title=document.getElementById('step-title')?.value.trim(),desc=document.getElementById('step-desc')?.value.trim();if(!title||!desc)return;const id='extra-'+(Date.now().toString(36));state.extraSteps.push({id,title,desc,caption:'新增业务步骤',owner:'待定义',in:'待定义',out:'待定义',evidence:'E-106'});state.selectedStep=id;state.designRevision++;state.designConfirmed=false;state.taskStatus='ready';state.validationRun=false;state.modal=null;log('新增目标设计步骤 '+title);render();notice('业务步骤已添加到设计草案。');return;}
if(e.target.id==='search-form'){e.preventDefault();let val=document.getElementById('global-search')?.value||'';state.modal=null;if(/开发|任务|agent|coding/i.test(val))setPage('development');else if(/设计|架构|流程/i.test(val))setPage('design');else if(/验收|验证|测试|证据/i.test(val))setPage('verification');else setPage('project',{projectSub:'explore'});return;}
}
document.addEventListener('click',act);document.addEventListener('submit',onSubmit);document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.modal){state.modal=null;renderModal();return;}if(state.drawer){state.drawer=null;renderDrawer();return;}if(state.tour){state.tour=null;renderTour();return;}}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();showModal('search');setTimeout(()=>document.getElementById('global-search')?.focus(),0);}});
// Optional embedded client-side workspace preview mode: unrecognized projects have generic target questions, never falsely mapped to AI-Wiki source.
const origCurrentSteps=currentSteps;
currentSteps=()=>state.isSample?origCurrentSteps():[
{id:'discover',title:'澄清目标',caption:'确认业务问题',desc:'根据项目目标形成业务场景、主要输入和预期结果。',owner:'需求设计',in:'自然语言意图',out:'场景与验收目标',evidence:'E-106'},
{id:'identity',title:'设计流程',caption:'用户任务与关键状态',desc:'确定业务流程、判断节点、异常与人的参与边界。',owner:'业务设计',in:'用户场景',out:'流程草案',evidence:'E-106'},
{id:'value',title:'拆分能力',caption:'职责与数据归属',desc:'根据业务过程形成候选能力和必要协作关系。',owner:'架构设计',in:'业务流程',out:'能力架构草案',evidence:'E-106'},
{id:'compare',title:'实施规划',caption:'冻结执行契约',desc:'在关键设计确认后，将当前开发切片交给 Coding Agent。',owner:'开发控制',in:'已确认的设计',out:'工作项',evidence:'E-106'},
{id:'publish',title:'验证与演进',caption:'结果与证据核对',desc:'独立验证是否达到业务目标，并按证据决定下一步。',owner:'验证',in:'工程结果',out:'评估和反馈',evidence:'E-106'}].map(s=>({...s,...(state.flowEdits[s.id]||{})})).concat(state.extraSteps);
render();
